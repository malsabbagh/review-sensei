# ReviewSensei setup version: 5
# ReviewSensei new-install channel: v6
name: ReviewSensei review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: malsabbagh/review-sensei/.github/workflows/review-sensei-v6-pilot.yml@v6
    with:
      repository: ${{ github.repository }}
      repository_id: ${{ github.repository_id }}
      pull_request_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name }}
      event: pull_request
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

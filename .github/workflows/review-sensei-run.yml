name: ReviewSensei reusable runner

# This is the public reusable workflow. The installer uses the operator-managed
# v4 git tag as an update channel, resolves it at setup time, and writes the
# resulting commit SHA into customer setup-v4 files. The OIDC broker admits
# only that immutable SHA (plus an explicit legacy-SHA migration window).
# PyPI remains the primary package channel; the source fallback installs the
# executing workflow commit SHA directly.
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      operation:
        required: false
        default: review
        type: string
      repository:
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_ref:
        required: true
        type: string
      head_repository:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      source_kind:
        required: false
        default: issue
        type: string
      source_comment_id:
        required: false
        type: string
      source_updated_at:
        required: false
        type: string
      root_comment_id:
        required: false
        type: string
      review_sensei_version:
        required: true
        type: string
      enable_review:
        required: false
        default: 'false'
        type: string
      enable_github_writes:
        required: false
        default: 'false'
        type: string
      enable_learning_prs:
        required: false
        default: 'false'
        type: string
      enable_mention_replies:
        required: false
        default: 'false'
        type: string
      upload_artifacts:
        required: false
        default: 'false'
        type: string
    secrets:
      OLLAMA_API_KEY:
        required: false

concurrency:
  group: reviewsensei-${{ inputs.repository }}-${{ inputs.source_comment_id || inputs.head_sha || inputs.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  automatic-cloud:
    if: inputs.mode == 'automatic' && inputs.operation == 'review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha || inputs.base_ref }}
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          version_pattern = re.compile(r"^v?[0-9]+\.[0-9]+\.[0-9]+$")
          if os.environ.get("MODE") != "automatic":
              raise SystemExit("automatic job received an invalid mode")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          for name in ("BASE_REF", "HEAD_REF"):
              value = os.environ.get(name, "")
              if not value or value.startswith("-") or not ref_pattern.fullmatch(value):
                  raise SystemExit(f"{name} input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          if not version_pattern.fullmatch(os.environ.get("REVIEW_SENSEI_VERSION", "")):
              raise SystemExit("ReviewSensei version must be exact")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@([a-f0-9]{40})$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a full commit SHA." >&2
            exit 1
          fi
          workflow_ref_sha="${BASH_REMATCH[1]}"
          if [[ "$workflow_ref_sha" != "$REVIEW_SENSEI_WORKFLOW_SHA" ]]; then
            echo "::error::The reusable workflow ref does not match the executing workflow SHA." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check --upgrade pip 2>&1 | tee "$pypi_log" && \
            "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee -a "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Prepare bounded trusted-base diff
        env:
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then
            args+=(--head-repository "$HEAD_REPOSITORY")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000

      - name: Run cloud-provider review
        env:
          OLLAMA_BASE_URL: https://ollama.com/api
          OLLAMA_MODEL: ${{ vars.REVIEWSENSEI_CLOUD_MODEL || 'deepseek-v4-flash:cloud' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo '::error::OLLAMA_API_KEY is required for cloud mode' >&2
            exit 1
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" --diff pr.patch \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --base-url "$OLLAMA_BASE_URL" --model "$OLLAMA_MODEL" --output review.json

      - name: Publish validated review through the broker
        if: inputs.enable_github_writes == 'true' && inputs.enable_review == 'true'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          LEARNING_PRS: ${{ inputs.enable_learning_prs }}
        run: |
          learning_args=()
          if [[ "$LEARNING_PRS" == "true" ]]; then
            learning_args+=(--enable-learning-prs)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --allow-write --enable-review "${learning_args[@]}"

      - name: Upload opt-in review artifact
        if: inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-review
          path: review.json
          if-no-files-found: error
          retention-days: 7

  trusted-local:
    if: inputs.mode == 'manual'
    runs-on: [self-hosted, linux, x64, ollama]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha || inputs.base_ref }}
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@([a-f0-9]{40})$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a full commit SHA." >&2
            exit 1
          fi
          workflow_ref_sha="${BASH_REMATCH[1]}"
          if [[ "$workflow_ref_sha" != "$REVIEW_SENSEI_WORKFLOW_SHA" ]]; then
            echo "::error::The reusable workflow ref does not match the executing workflow SHA." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Prepare and run trusted local review
        if: inputs.operation == 'review'
        env:
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          OLLAMA_MODEL: ${{ vars.REVIEWSENSEI_LOCAL_MODEL || 'qwen3.5:4b' }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then args+=(--head-repository "$HEAD_REPOSITORY"); fi
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null
          ollama show "$OLLAMA_MODEL" >/dev/null
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" --diff pr.patch \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --base-url http://127.0.0.1:11434/api --model "$OLLAMA_MODEL" --output review.json

      - name: Publish trusted local review and learnings
        if: inputs.operation == 'review' && inputs.enable_github_writes == 'true'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          LEARNING_PRS: ${{ inputs.enable_learning_prs }}
        run: |
          review_args=()
          if [[ "$ENABLE_REVIEW" == "true" ]]; then
            review_args+=(--enable-review)
          fi
          if [[ "$LEARNING_PRS" == "true" ]]; then
            review_args+=(--enable-learning-prs)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --allow-write "${review_args[@]}"

      - name: Generate and publish trusted local mention reply
        if: inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          OLLAMA_MODEL: ${{ vars.REVIEWSENSEI_LOCAL_MODEL || 'qwen3.5:4b' }}
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null
          ollama show "$OLLAMA_MODEL" >/dev/null
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            --generate --provider ollama --base-url http://127.0.0.1:11434/api \
            --model "$OLLAMA_MODEL" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply

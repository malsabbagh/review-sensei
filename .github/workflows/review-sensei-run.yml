name: ReviewSensei reusable runner

# This is the public reusable workflow. Setup-v4 callers use the
# operator-managed v5 git tag as their update channel. The OIDC broker resolves
# that tag at capability-exchange time and requires the executing workflow SHA
# to match it. PyPI remains the primary package channel; the source fallback
# installs the executing workflow commit SHA directly.
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      review_mode:
        required: false
        default: merge-focused
        type: string
      provider_mode:
        required: false
        default: ''
        type: string
      model:
        required: false
        default: ''
        type: string
      provider_profile:
        # Unused. Hosted selection is provider_mode + model only.
        # Non-empty values fail closed.
        required: false
        default: ''
        type: string
      operation:
        required: false
        default: review
        type: string
      repository:
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_ref:
        required: true
        type: string
      head_repository:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      source_kind:
        required: false
        default: issue
        type: string
      source_comment_id:
        required: false
        type: string
      source_updated_at:
        required: false
        type: string
      root_comment_id:
        required: false
        type: string
      comment_body:
        required: false
        default: ''
        type: string
      comment_actor:
        required: false
        default: ''
        type: string
      comment_actor_type:
        # No default: a command caller must state the actor type explicitly so
        # an omitted value fails the maintainer gate instead of silently
        # satisfying it.
        required: false
        default: ''
        type: string
      comment_association:
        required: false
        default: ''
        type: string
      review_sensei_version:
        required: true
        type: string
      pull_request_title:
        required: false
        default: ''
        type: string
      stages_dir:
        required: false
        default: ''
        type: string
      categories_dir:
        required: false
        default: ''
        type: string
      enable_review:
        required: false
        default: 'false'
        type: string
      enable_auto_approve:
        required: false
        default: 'true'
        type: string
      enable_learning_proposals:
        required: false
        default: 'false'
        type: string
      enable_github_writes:
        required: false
        default: 'false'
        type: string
      enable_learning_prs:
        required: false
        default: 'false'
        type: string
      enable_mention_replies:
        required: false
        default: 'false'
        type: string
      upload_artifacts:
        required: false
        default: 'false'
        type: string
      allow_unqualified_profile:
        # Unused. OpenRouter hosted runs use --provider openrouter --model.
        # Non-false values fail closed.
        required: false
        default: 'false'
        type: string
    secrets:
      OLLAMA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

concurrency:
  # Use only host-provided identities in the group key.  In particular, do not
  # interpolate the optional pull_request_number input: workflow-level
  # concurrency is evaluated before any validation job can reject it. A
  # pull_request event gets latest-wins cancellation per PR. Reply events
  # (including pull_request_review_comment) always use their unique run id so
  # one reply can never replace another reply for the same PR. Manual reviews
  # have no host PR identity at workflow-concurrency time and fall back to the
  # unique run id; provider-level concurrency below joins them by the
  # authoritative PR number after preflight.
  group: reviewsensei-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (github.event.pull_request.number || github.run_id) || github.run_id }}
  cancel-in-progress: ${{ inputs.operation == 'review' && github.event.pull_request.number != null }}

jobs:
  validate-provider-mode:
    # opened/synchronize/reopened still fire for drafts. Skip those review runs
    # so they are not failed by later eligibility checks; ready_for_review and
    # non-pull_request operations continue.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      normalized_provider_mode: ${{ steps.reject-unsupported-provider-mode.outputs.normalized_provider_mode }}
      normalized_model: ${{ steps.reject-unsupported-provider-mode.outputs.normalized_model }}
      active_provider: ${{ steps.reject-unsupported-provider-mode.outputs.active_provider }}
    steps:
      - name: Reject unsupported provider mode
        id: reject-unsupported-provider-mode
        env:
          PROVIDER_MODE: ${{ inputs.provider_mode }}
          MODE: ${{ inputs.mode }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          MODEL: ${{ inputs.model }}
          PROVIDER_PROFILE: ${{ inputs.provider_profile }}
          ALLOW_UNQUALIFIED_PROFILE: ${{ inputs.allow_unqualified_profile }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request_number }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          ENABLE_AUTO_APPROVE: ${{ inputs.enable_auto_approve }}
          ENABLE_LEARNING_PROPOSALS: ${{ inputs.enable_learning_proposals }}
          ENABLE_GITHUB_WRITES: ${{ inputs.enable_github_writes }}
          ENABLE_LEARNING_PRS: ${{ inputs.enable_learning_prs }}
          ENABLE_MENTION_REPLIES: ${{ inputs.enable_mention_replies }}
          UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_ACTOR: ${{ inputs.comment_actor }}
          COMMENT_ACTOR_TYPE: ${{ inputs.comment_actor_type }}
          COMMENT_ASSOCIATION: ${{ inputs.comment_association }}
        run: |
          set -euo pipefail
          PROVIDER_MODE="$(printf '%s' "$PROVIDER_MODE" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          MODEL="$(printf '%s' "$MODEL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          REVIEW_MODE="$(printf '%s' "$REVIEW_MODE" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$REVIEW_MODE" ]; then
            # The input is optional with a `merge-focused` default and the CLI
            # resolves an empty mode to the same default, so an absent or empty
            # value is normalized instead of rejected: a caller that pins the
            # tag without passing the input must not fail a run the CLI accepts.
            REVIEW_MODE=merge-focused
          fi
          case "$PROVIDER_MODE" in
            ""|local|local-ollama|cloud|cloud-ollama|openrouter) ;;
            *)
              echo '::error::ReviewSensei provider mode is unsupported; use local-ollama, cloud-ollama, or openrouter (local and cloud are aliases).' >&2
              exit 1
              ;;
          esac
          case "$PROVIDER_MODE" in
            openrouter) active_provider=openrouter ;;
            local|local-ollama) active_provider=local ;;
            cloud|cloud-ollama) active_provider=cloud ;;
            "")
              if [[ "$MODE" == "manual" ]]; then
                active_provider=local
              else
                active_provider=cloud
              fi
              ;;
            *) active_provider=invalid ;;
          esac
          case "$PROVIDER_MODE" in
            cloud) resolved_provider_mode=cloud-ollama ;;
            local) resolved_provider_mode=local-ollama ;;
            openrouter|cloud-ollama|local-ollama) resolved_provider_mode="$PROVIDER_MODE" ;;
            "")
              if [[ "$MODE" == "manual" ]]; then
                resolved_provider_mode=local-ollama
              else
                resolved_provider_mode=cloud-ollama
              fi
              ;;
            *) resolved_provider_mode=invalid ;;
          esac
          if [[ -n "$PROVIDER_PROFILE" ]]; then
            echo '::error::provider_profile is unused; set provider_mode to openrouter and model via REVIEWSENSEI_MODEL.' >&2
            exit 1
          fi
          case "$ALLOW_UNQUALIFIED_PROFILE" in
            ""|false)
              ;;
            true)
              echo '::error::allow_unqualified_profile is unused for hosted OpenRouter runs.' >&2
              exit 1
              ;;
            *)
              echo '::error::allow_unqualified_profile must be empty or false' >&2
              exit 1
              ;;
          esac
          case "$OPERATION" in
            review|reply|command) ;;
            *) echo '::error::operation must be review, reply, or command' >&2; exit 1 ;;
          esac
          case "$MODE" in
            automatic|manual) ;;
            *) echo '::error::workflow mode must be automatic or manual' >&2; exit 1 ;;
          esac
          case "$REVIEW_MODE" in
            advisory|merge-focused|strict) ;;
            legacy)
              if [ "$OPERATION" = review ]; then
                echo '::error::legacy review mode is retired; migrate configuration to merge-focused (set the REVIEWSENSEI_REVIEW_MODE repository variable to merge-focused, or merge the pending setup-v5 pull request from the ReviewSensei App, then re-run)' >&2
                exit 1
              fi
              # Reply and command operations never resolve a review policy (the
              # CLI reply path is exempt from the retired-mode guard), so a
              # retired stored value must not fail them: warn and continue on
              # the supported default.
              echo "::warning::legacy review mode is retired and ignored for $OPERATION operations; set the REVIEWSENSEI_REVIEW_MODE repository variable to merge-focused or merge the pending setup-v5 pull request from the ReviewSensei App" >&2
              REVIEW_MODE=merge-focused
              ;;
            *) echo '::error::review mode must be advisory, merge-focused, or strict' >&2; exit 1 ;;
          esac
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo '::error::repository input is invalid' >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::repository id must be a positive decimal integer' >&2
            exit 1
          fi
          if [[ -z "$BASE_REF" || "$BASE_REF" == -* || "$BASE_REF" == *--* || "$BASE_REF" == *- || ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo '::error::base ref input is invalid' >&2
            exit 1
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::base sha input is invalid' >&2
            exit 1
          fi
          if [[ -n "$HEAD_REPOSITORY" && ! "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo '::error::head repository input is invalid' >&2
            exit 1
          fi
          if [[ "$OPERATION" == review && "$ENABLE_REVIEW" == true ]]; then
            if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::pull request number is required for review operations' >&2
              exit 1
            fi
            if [[ -z "$HEAD_REF" || "$HEAD_REF" == -* || "$HEAD_REF" == *--* || "$HEAD_REF" == *- || ! "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo '::error::head ref input is invalid' >&2
              exit 1
            fi
            if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo '::error::head sha is required for review operations' >&2
              exit 1
            fi
          elif [[ "$OPERATION" == reply && "$ENABLE_GITHUB_WRITES" == true && "$ENABLE_MENTION_REPLIES" == true && ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::pull request number is required for reply operations' >&2
            exit 1
          elif [[ "$OPERATION" == command ]]; then
            # Command inputs are checked whether or not writes are enabled, so
            # a caller cannot route command payloads through the workflow while
            # the job that consumes them is skipped.
            if [[ "$ENABLE_GITHUB_WRITES" != true ]]; then
              echo '::error::command operations require enable_github_writes' >&2
              exit 1
            fi
            # LC_ALL=C pins wc to byte counting instead of the runner locale.
            comment_body_bytes="$(printf '%s' "$COMMENT_BODY" | LC_ALL=C wc -c)"
            if [[ ! "$INPUT_PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::command operations require an explicit pull_request_number input' >&2
              exit 1
            fi
            if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ || ! "$SOURCE_COMMENT_ID" =~ ^[1-9][0-9]*$ || -z "$COMMENT_BODY" || "$comment_body_bytes" -gt 4096 || -z "$COMMENT_ACTOR" || ${#COMMENT_ACTOR} -gt 256 ]]; then
              echo '::error::command operations require a pull request, current head SHA, and source comment identity' >&2
              exit 1
            fi
            if [[ "$COMMENT_ACTOR_TYPE" != "User" || ! "$COMMENT_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
              echo '::error::command operations require an authorized human maintainer' >&2
              exit 1
            fi
          fi
          for flag in ENABLE_REVIEW ENABLE_AUTO_APPROVE ENABLE_LEARNING_PROPOSALS ENABLE_GITHUB_WRITES ENABLE_LEARNING_PRS ENABLE_MENTION_REPLIES UPLOAD_ARTIFACTS; do
            value="${!flag}"
            case "$value" in
              ''|true|false) ;;
              *) echo "::error::${flag} must be true or false" >&2; exit 1 ;;
            esac
          done
          if [[ -n "$MODEL" && "$MODEL" == -* ]]; then
            echo '::error::model must not start with -' >&2
            exit 1
          fi
          case "$PROVIDER_MODE" in
            openrouter)
              if [[ -n "$MODEL" && "$MODEL" == *:cloud* ]]; then
                echo '::error::openrouter model must not use ollama cloud suffix' >&2
                exit 1
              fi
              ;;
            ""|local|local-ollama|cloud|cloud-ollama)
              if [[ -n "$MODEL" && "$MODEL" == */* ]]; then
                echo '::error::ollama model must not use vendor/model openrouter slug' >&2
                exit 1
              fi
              ;;
          esac
          {
            echo "normalized_provider_mode=$resolved_provider_mode"
            echo "normalized_model=$MODEL"
            echo "active_provider=$active_provider"
          } >> "$GITHUB_OUTPUT"

  authoritative-preflight:
    needs: validate-provider-mode
    # Validation is deliberately a dependency.  If the cheap input checks
    # fail, do not make an unnecessary GitHub API request.  Reply operations
    # still run this no-op job so the provider jobs can share one dependency.
    if: needs.validate-provider-mode.result == 'success'
    outputs:
      pull_request_title_b64: ${{ steps.fetch-pr.outputs.pull_request_title_b64 }}
      base_sha: ${{ steps.fetch-pr.outputs.base_sha }}
      pull_request_number: ${{ steps.fetch-pr.outputs.pull_request_number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Validate live pull-request identity before provider execution
        id: fetch-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          OPERATION: ${{ inputs.operation }}
          STAGES_DIR: ${{ inputs.stages_dir }}
          CATEGORIES_DIR: ${{ inputs.categories_dir }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
        run: |
          set -euo pipefail
          # Command mutations reuse the live head/branch checks below, so a
          # stale or fabricated head SHA fails here rather than only at the
          # broker. Reviews need the fetch for their base SHA and title.
          if [[ "$OPERATION" != "command" && ("$OPERATION" != "review" || "$ENABLE_REVIEW" != "true") ]]; then
            echo 'authoritative PR preflight not required for this operation'
            exit 0
          fi
          for config_path in "$STAGES_DIR" "$CATEGORIES_DIR"; do
            if [[ -n "$config_path" && ( "$config_path" = /* || "$config_path" == *'..'* || ! "$config_path" =~ ^[A-Za-z0-9._/-]+$ ) ]]; then
              echo '::error::trusted stage/category paths must be repository-relative' >&2
              exit 1
            fi
          done
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::repository id must be a positive decimal integer' >&2; exit 1; }
          [[ -n "$BASE_REF" && "$BASE_REF" != -* && "$BASE_REF" != *--* && "$BASE_REF" != *- && "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo '::error::base ref identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::base sha identity is invalid' >&2
            exit 1
          fi
          payload="$(mktemp "$RUNNER_TEMP/review-sensei-pr.XXXXXX")"
          trap 'rm -f "$payload"' EXIT
          umask 077
          if ! gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" > "$payload"; then
            echo '::error::authoritative GitHub pull-request preflight was unavailable; refusing provider execution' >&2
            exit 1
          fi
          python - "$payload" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          path = sys.argv[1]
          flags = os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0)
          try:
              descriptor = os.open(path, flags)
          except OSError as error:
              raise SystemExit(f"pull request metadata cannot be opened safely: {error}")
          with os.fdopen(descriptor, "rb") as stream:
              raw = stream.read(512 * 1024 + 1)
          if len(raw) > 512 * 1024:
              raise SystemExit("pull request metadata exceeds the configured response limit")
          try:
              data = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"pull request metadata is not valid JSON: {error}")
          if not isinstance(data, dict) or data.get("state") != "open" or data.get("draft") is True:
              raise SystemExit("pull request is not eligible for review")
          requested_number = os.environ.get("PULL_REQUEST", "")
          if (
              isinstance(data.get("number"), bool)
              or not isinstance(data.get("number"), int)
              or data.get("number") != int(requested_number)
          ):
              raise SystemExit("pull request number identity does not match")
          head = data.get("head")
          base = data.get("base")
          head_repo = head.get("repo") if isinstance(head, dict) else None
          base_repo = base.get("repo") if isinstance(base, dict) else None
          if not isinstance(head_repo, dict) or not isinstance(base_repo, dict):
              raise SystemExit("pull request identity metadata is unavailable")
          repository = os.environ.get("REPOSITORY", "")
          repository_id = os.environ.get("REPOSITORY_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*", repository_id):
              raise SystemExit("repository id must be a positive decimal integer")
          if base_repo.get("full_name") != repository or base_repo.get("id") != int(repository_id):
              raise SystemExit("pull request repository identity does not match")
          if head_repo.get("full_name") != repository or head_repo.get("fork") is not False:
              raise SystemExit("pull request head repository is not eligible")
          if head.get("sha") != os.environ.get("HEAD_SHA", ""):
              raise SystemExit("pull request head is stale")
          if base.get("ref") != os.environ.get("BASE_REF", ""):
              raise SystemExit("pull request base branch is stale")
          supplied_base = os.environ.get("BASE_SHA", "")
          if supplied_base and base.get("sha") != supplied_base:
              raise SystemExit("pull request base is stale")
          supplied_head_repo = os.environ.get("HEAD_REPOSITORY", "")
          if supplied_head_repo and supplied_head_repo != head_repo.get("full_name"):
              raise SystemExit("pull request head repository does not match")
          if not re.fullmatch(r"[a-f0-9]{40}", str(head.get("sha", ""))):
              raise SystemExit("pull request head identity is invalid")
          if not re.fullmatch(r"[a-f0-9]{40}", str(base.get("sha", ""))):
              raise SystemExit("pull request base identity is invalid")
          title = data.get("title", "")
          if not isinstance(title, str) or len(title.encode("utf-8")) > 256:
              raise SystemExit("pull request title exceeds the 256-byte limit")
          encoded = base64.b64encode(title.encode("utf-8")).decode("ascii")
          if len(encoded) > 8192:
              raise SystemExit("encoded pull request title exceeds the workflow output limit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pull_request_title_b64={encoded}\n")
              output.write(f"base_sha={base['sha']}\n")
              output.write(f"pull_request_number={data['number']}\n")
          PY

  command:
    needs: [validate-provider-mode, authoritative-preflight]
    # authoritative-preflight re-reads the live PR and rejects a head SHA that
    # no longer matches, so the mutation only runs against the commit the
    # maintainer addressed.
    if: inputs.operation == 'command' && inputs.enable_github_writes == 'true' && needs.validate-provider-mode.result == 'success' && needs.authoritative-preflight.result == 'success'
    concurrency:
      group: reviewsensei-command-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The session-comment mutation is authorized by the OIDC broker's
    # `review_session` capability (pull_requests: write); GITHUB_TOKEN keeps no
    # write scope, matching ADR 0022/0050.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@refs/tags/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a public git tag." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            source_dir="$RUNNER_TEMP/review-sensei-workflow-source"
            rm -rf "$source_dir"
            git init --bare "$source_dir"
            git --git-dir="$source_dir" fetch --depth=1 \
              https://github.com/malsabbagh/review-sensei.git \
              "$REVIEW_SENSEI_WORKFLOW_SHA"
            object_type="$(git --git-dir="$source_dir" cat-file -t "$REVIEW_SENSEI_WORKFLOW_SHA")"
            if [[ "$object_type" == "tag" ]]; then
              REVIEW_SENSEI_WORKFLOW_SHA="$(git --git-dir="$source_dir" rev-parse "${REVIEW_SENSEI_WORKFLOW_SHA}^{commit}")"
            elif [[ "$object_type" != "commit" ]]; then
              echo "::error::The ReviewSensei workflow SHA is not a commit or an annotated tag." >&2
              exit 1
            fi
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Apply broker-attested maintainer command
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_ACTOR: ${{ inputs.comment_actor }}
          COMMENT_ACTOR_TYPE: ${{ inputs.comment_actor_type }}
          COMMENT_ASSOCIATION: ${{ inputs.comment_association }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.reviewsensei.dev")"
          oidc_token="$(printf '%s' "$oidc_response" | "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json, sys; value = json.load(sys.stdin).get("value"); assert isinstance(value, str) and value; print(value)')"
          attestation="$RUNNER_TEMP/review-sensei-command-attestation.json"
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - "$attestation" <<'PY'
          import json
          import os
          import re
          import sys
          import time

          repository = os.environ.get("REPOSITORY", "")
          repository_id = os.environ.get("REPOSITORY_ID", "")
          pull_request = os.environ.get("PULL_REQUEST", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          source_comment_id = os.environ.get("SOURCE_COMMENT_ID", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          workflow_ref = os.environ.get("JOB_WORKFLOW_REF", "")
          workflow_sha = os.environ.get("JOB_WORKFLOW_SHA", "")
          if not re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", repository) or not re.fullmatch(r"[1-9][0-9]*", repository_id) or not re.fullmatch(r"[1-9][0-9]*", pull_request) or not re.fullmatch(r"[a-f0-9]{40}", head_sha) or not re.fullmatch(r"[1-9][0-9]*", source_comment_id) or not re.fullmatch(r"[1-9][0-9]{0,18}", run_id) or not re.fullmatch(r"[a-f0-9]{40}", workflow_sha):
              raise SystemExit("hosted command identity is invalid")
          json.dump({
              "version": 1,
              "repository": repository,
              "repository_id": int(repository_id),
              "pull_request": int(pull_request),
              "head_sha": head_sha,
              "operation": "command",
              "source_comment_id": int(source_comment_id),
              "run_id": run_id,
              "issued_at": int(time.time()),
              "concurrency_group": f"reviewsensei-session-{repository_id}-{pull_request}",
              "job_workflow_ref": workflow_ref,
              "job_workflow_sha": workflow_sha,
          }, open(sys.argv[1], "w", encoding="utf-8"), separators=(",", ":"))
          PY
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github command \
            --comment-body "$COMMENT_BODY" --actor "$COMMENT_ACTOR" \
            --actor-type "$COMMENT_ACTOR_TYPE" --association "$COMMENT_ASSOCIATION" \
            --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST" --head-sha "$HEAD_SHA" \
            --source-comment-id "$SOURCE_COMMENT_ID" --session-attestation "$attestation" \
            --github-session-ledger --oidc-token "$oidc_token" --allow-write

  cloud:
    needs: [validate-provider-mode, authoritative-preflight]
    # Compatibility marker for consumers that inspect the historical single
    # dependency spelling: needs: validate-provider-mode
    if: ((inputs.operation == 'review' && inputs.enable_review == 'true') || (inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true')) && needs.validate-provider-mode.outputs.active_provider == 'cloud'
    concurrency:
      # All provider modes share this review group, so a newer cloud review
      # cancels an older local review (and vice versa) for the same PR. Reply
      # operations intentionally use the triggering run id and never cancel a
      # sibling reply. The preflight output is authoritative for manual
      # reviews; event PR metadata is only a host-provided fallback.
      group: reviewsensei-provider-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (needs.authoritative-preflight.outputs.pull_request_number || github.event.pull_request.number || github.run_id) || github.run_id }}
      cancel-in-progress: ${{ inputs.operation == 'review' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authoritative-preflight.outputs.base_sha || inputs.base_sha || inputs.base_ref }}
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          OPERATION: ${{ inputs.operation }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode || 'cloud-ollama' }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          version_pattern = re.compile(r"^v?[0-9]+\.[0-9]+\.[0-9]+$")

          def valid_ref(value: str) -> bool:
              return bool(
                  value
                  and not value.startswith("-")
                  and "--" not in value
                  and not value.endswith("-")
                  and ref_pattern.fullmatch(value)
              )

          if os.environ.get("MODE") not in {"automatic", "manual"}:
              raise SystemExit("workflow mode is invalid")
          if os.environ.get("OPERATION") not in {"review", "reply"}:
              raise SystemExit("workflow operation is invalid")
          if os.environ.get("PROVIDER_MODE") not in {"cloud", "cloud-ollama"}:
              raise SystemExit("cloud job received an invalid provider mode")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          for name in ("BASE_REF",):
              value = os.environ.get(name, "")
              if not valid_ref(value):
                  raise SystemExit(f"{name} input is invalid")
          head_ref = os.environ.get("HEAD_REF", "")
          if os.environ.get("OPERATION") == "review" and not valid_ref(head_ref):
              raise SystemExit("HEAD_REF input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if os.environ.get("OPERATION") == "review" and not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          if not version_pattern.fullmatch(os.environ.get("REVIEW_SENSEI_VERSION", "")):
              raise SystemExit("ReviewSensei version must be exact")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@refs/tags/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a public git tag." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check --upgrade pip 2>&1 | tee "$pypi_log" && \
            "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee -a "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            source_dir="$RUNNER_TEMP/review-sensei-workflow-source"
            rm -rf "$source_dir"
            git init --bare "$source_dir"
            git --git-dir="$source_dir" fetch --depth=1 \
              https://github.com/malsabbagh/review-sensei.git \
              "$REVIEW_SENSEI_WORKFLOW_SHA"
            object_type="$(git --git-dir="$source_dir" cat-file -t "$REVIEW_SENSEI_WORKFLOW_SHA")"
            if [[ "$object_type" == "tag" ]]; then
              REVIEW_SENSEI_WORKFLOW_SHA="$(git --git-dir="$source_dir" rev-parse "${REVIEW_SENSEI_WORKFLOW_SHA}^{commit}")"
            elif [[ "$object_type" != "commit" ]]; then
              echo "::error::The ReviewSensei workflow SHA is not a commit or an annotated tag." >&2
              exit 1
            fi
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Prepare bounded trusted-base diff
        if: inputs.operation == 'review'
        env:
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then
            args+=(--head-repository "$HEAD_REPOSITORY")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000

      - name: Decide whether the automatic review budget is already spent
        id: budget-admission
        if: inputs.operation == 'review' && inputs.enable_review == 'true'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ENABLE_GITHUB_WRITES: ${{ inputs.enable_github_writes }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::review budget repository is invalid' >&2; exit 1; }
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget repository id is invalid' >&2; exit 1; }
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget pull request is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::review budget head is invalid' >&2; exit 1; }
          comments_file="$RUNNER_TEMP/review-sensei-issue-comments.json"
          page_dir="$RUNNER_TEMP/review-sensei-comment-pages"
          rm -rf "$page_dir"
          mkdir -p "$page_dir"
          page=1
          while [[ "$page" -le 10 ]]; do
            if ! GH_TOKEN="$GH_READ_TOKEN" gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments?per_page=100&page=${page}" >"$page_dir/$page.json"; then
              echo '::error::review budget ledger could not be read' >&2
              exit 1
            fi
            count="$("$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print(len(value) if isinstance(value, list) else -1)' "$page_dir/$page.json")"
            if [[ "$count" -lt 0 ]]; then
              echo '::error::review budget comment page is invalid' >&2
              exit 1
            fi
            if [[ "$count" -lt 100 ]]; then
              break
            fi
            if [[ "$page" -eq 10 ]]; then
              echo '::error::review budget comments exceed the configured bound' >&2
              exit 1
            fi
            page=$((page + 1))
          done
          PAGE_DIR="$page_dir" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission assemble
          decision="$(REPOSITORY="$REPOSITORY" REPOSITORY_ID="$REPOSITORY_ID" PULL_REQUEST="$PULL_REQUEST" HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission decide)"
          if [[ "$decision" == "review" ]]; then
            echo "spent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$decision" != "spent" ]]; then
            echo '::error::review budget decision was invalid' >&2
            exit 1
          fi
          echo "spent=true" >> "$GITHUB_OUTPUT"
          notice_state="$(HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission notice-status)"
          if [[ "$notice_state" == "posted" ]]; then
            echo "spent-budget notice already posted"
            exit 0
          fi
          if [[ "$ENABLE_GITHUB_WRITES" != "true" ]]; then
            echo "automatic review budget is spent; github writes are disabled, skipping the notice"
            exit 0
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "automatic review budget is spent; Actions OIDC token is unavailable, skipping the notice"
            exit 0
          fi
          notice_file="$RUNNER_TEMP/review-sensei-budget-notice.txt"
          HEAD_SHA="$HEAD_SHA" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission render-notice "$notice_file"
          oidc_response="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.reviewsensei.dev")"
          oidc_token="$(printf '%s' "$oidc_response" | "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value)')"
          broker_body="$(OIDC_TOKEN="$oidc_token" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; print(json.dumps({"oidc_token": os.environ["OIDC_TOKEN"], "capability": "issue_reply"}))')"
          unset oidc_token
          broker_response="$(curl --fail --silent --show-error -H "Content-Type: application/json" -H "Accept: application/json" --data "$broker_body" https://github.reviewsensei.dev/github/token)"
          unset broker_body
          reply_token="$(BROKER_RESPONSE="$broker_response" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; value=json.loads(os.environ["BROKER_RESPONSE"]).get("token"); assert isinstance(value,str) and value.strip(); print(value)')"
          unset broker_response
          GH_TOKEN="$reply_token" gh api --method POST -H "Accept: application/vnd.github+json" "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments" -f body="$(cat "$notice_file")" >/dev/null
          unset reply_token
          echo "automatic review budget is spent; skipping the review CLI"

      - name: Run cloud-provider review
        id: provider-review
        if: inputs.operation == 'review' && inputs.enable_review == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true'
        env:
          REPOSITORY_ID: ${{ inputs.repository_id }}
          MODE: ${{ inputs.mode }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_MODEL: ${{ vars.REVIEWSENSEI_CLOUD_MODEL }}
          BACKEND_DEFAULT: deepseek-v4.1-flash:cloud
          OLLAMA_BASE_URL: https://ollama.com/api
          OLLAMA_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model || vars.REVIEWSENSEI_MODEL || vars.REVIEWSENSEI_CLOUD_MODEL || 'deepseek-v4.1-flash:cloud' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          TITLE_B64: ${{ needs.authoritative-preflight.outputs.pull_request_title_b64 }}
          STAGES_DIR: ${{ inputs.stages_dir }}
          CATEGORIES_DIR: ${{ inputs.categories_dir }}
          LEARNING_PROPOSALS: ${{ inputs.enable_learning_proposals }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts }}
        run: |
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo '::error::OLLAMA_API_KEY is required for cloud-ollama mode' >&2
            exit 1
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", ""),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          if resolved != os.environ["OLLAMA_MODEL"]:
              print(
                  "::error::resolved hosted model does not match workflow env",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          if [[ -n "$TITLE_B64" && ( ${#TITLE_B64} -gt 8192 || ! "$TITLE_B64" =~ ^[A-Za-z0-9+/=]+$ ) ]]; then
            echo '::error::authoritative pull-request title output is invalid' >&2
            exit 1
          fi
          TITLE=""
          if [[ -n "$TITLE_B64" ]] && ! TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode)"; then
            echo '::error::authoritative pull-request title output could not be decoded' >&2
            exit 1
          fi
          review_args=(--diff pr.patch --repository "$REPOSITORY" --pull-request "$PULL_REQUEST")
          review_args+=(--review-mode "$REVIEW_MODE")
          if [[ -n "$TITLE" ]]; then review_args+=(--title "$TITLE"); fi
          if [[ -n "$STAGES_DIR" ]]; then review_args+=(--stages-dir "$STAGES_DIR"); fi
          if [[ -n "$CATEGORIES_DIR" ]]; then review_args+=(--categories-dir "$CATEGORIES_DIR"); fi
          if [[ "$LEARNING_PROPOSALS" != "true" ]]; then review_args+=(--no-learning-proposals); fi
          if [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--head-sha "$HEAD_SHA"); fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--base-sha "$BASE_SHA"); fi
          if [[ "$UPLOAD_ARTIFACTS" == "true" ]]; then
            review_args+=(--recovery-artifact recovery-artifact.json)
          fi
          # Reserve the round, checkpoint the identity-bound transaction, and
          # emit the trusted admission artifacts before inference results are
          # published. The transaction lives in the broker-attested comment
          # ledger rather than a runner-local file, so the publication step of
          # this run and the analysis of the next run read the same durable
          # rounds, baselines, and grants.
          review_args+=(--transaction --github-session-ledger \
            --repository-id "$REPOSITORY_ID" \
            --configuration-context-output configuration-context.json \
            --admission-context-output admission-context.json)
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" "${review_args[@]}" \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --base-url "$OLLAMA_BASE_URL" --model "$OLLAMA_MODEL" \
            --output review.json --outcome outcome.json

      # success() && !cancelled() skips a pointless API call after a failed
      # provider step or cancelled run. Publish still has its own cancellation
      # guard and requires status=current from this head check.
      - name: Confirm live pull-request head is still current
        id: publish-admission
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          live_sha=""
          for attempt in 1 2 3; do
            err_file="$RUNNER_TEMP/rs-head-revalidate.$$"
            if live_sha="$(gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha' 2>"$err_file")"; then
              rm -f "$err_file"
              break
            fi
            err_text="$(tr -d '\000' <"$err_file" | tail -n 20)"
            rm -f "$err_file"
            if [[ "$err_text" =~ HTTP\ (401|403|404) ]]; then
              echo '::error::live pull-request head revalidation was unauthorized or missing; refusing publish' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::live pull-request head revalidation was unavailable; refusing publish' >&2
              exit 1
            fi
            delay=$((1 << (attempt - 1)))
            if [[ "$err_text" =~ HTTP\ 429 ]]; then
              delay=$((delay * 2))
            fi
            if [[ "$delay" -gt 8 ]]; then
              delay=8
            fi
            jitter_hundredths=$((RANDOM % 50))
            sleep "${delay}.${jitter_hundredths}"
          done
          if [[ ! "$live_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::live pull-request head identity is invalid; refusing publish' >&2
            exit 1
          fi
          if [[ "$live_sha" != "$HEAD_SHA" ]]; then
            echo '::error::publish skipped_stale: reviewed head is no longer the live pull-request head' >&2
            echo 'skipped_stale'
            echo 'status=skipped_stale' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish admission current'
          echo 'status=current' >> "$GITHUB_OUTPUT"

      - name: Publish or promote validated review through the broker
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required' && steps.publish-admission.outputs.status == 'current'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          LEARNING_PRS: ${{ inputs.enable_learning_prs }}
          AUTO_APPROVE: ${{ inputs.enable_auto_approve }}
          REVIEW_MODE: ${{ inputs.review_mode }}
        run: |
          publish_args=()
          if [[ "$ENABLE_REVIEW" == "true" ]]; then
            publish_args+=(--enable-review)
          fi
          if [[ "$LEARNING_PRS" == "true" ]]; then
            publish_args+=(--enable-learning-prs)
          fi
          if [[ "$AUTO_APPROVE" == "true" ]]; then
            publish_args+=(--enable-auto-approve)
          elif [[ "$AUTO_APPROVE" == "false" ]]; then
            publish_args+=(--no-auto-approve)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --outcome publication-outcome.json --github-session-ledger \
            --configuration-context configuration-context.json \
            --admission-context admission-context.json \
            --review-mode "$REVIEW_MODE" --allow-write "${publish_args[@]}"

      - name: Generate and publish cloud mention reply
        id: reply
        if: inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true'
        env:
          MODE: ${{ inputs.mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_MODEL: ${{ vars.REVIEWSENSEI_CLOUD_MODEL }}
          BACKEND_DEFAULT: deepseek-v4.1-flash:cloud
          OLLAMA_BASE_URL: https://ollama.com/api
          OLLAMA_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model || vars.REVIEWSENSEI_MODEL || vars.REVIEWSENSEI_CLOUD_MODEL || 'deepseek-v4.1-flash:cloud' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo '::error::OLLAMA_API_KEY is required for cloud-ollama mode' >&2
            exit 1
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", ""),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          if resolved != os.environ["OLLAMA_MODEL"]:
              print(
                  "::error::resolved hosted model does not match workflow env",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          reply_output="$RUNNER_TEMP/review-sensei-reply-status"
          set +e
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            --generate --provider ollama --base-url "$OLLAMA_BASE_URL" \
            --model "$OLLAMA_MODEL" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply > "$reply_output"
          reply_exit=$?
          set -e
          reply_status="$(grep -E '^(replied_and_resolved|already_replied_and_resolved|replied|already_replied|skipped_source_gone|skipped_no_mention|skipped_unauthorized|skipped_edited_source|skipped_pr_state|skipped_stale_head|skipped_fork)$' "$reply_output" | tail -n 1 || true)"
          echo "$reply_status"
          if [[ "$reply_exit" -ne 0 ]]; then
            echo "::error::mention reply command failed (exit $reply_exit)" >&2
            exit 1
          fi
          case "$reply_status" in
            replied_and_resolved|already_replied_and_resolved)
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              ;;
            replied|already_replied|skipped_source_gone|skipped_no_mention|\
              skipped_unauthorized|skipped_edited_source|skipped_pr_state|\
              skipped_stale_head|skipped_fork)
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected mention reply status: $reply_status" >&2
              exit 1
              ;;
          esac

      - name: Verify mention reply completed
        if: >-
          always() && inputs.operation == 'reply' &&
          inputs.enable_github_writes == 'true' &&
          inputs.enable_mention_replies == 'true' &&
          steps.reply.outcome != 'success'
        run: |
          echo '::error::mention reply step did not complete successfully' >&2
          exit 1

      - name: Upload opt-in review artifact
        if: inputs.operation == 'review' && inputs.upload_artifacts == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-review
          path: |
            review.json
            outcome.json
            recovery-artifact.json
          if-no-files-found: error
          retention-days: 7

  openrouter:
    needs: [validate-provider-mode, authoritative-preflight]
    if: ((inputs.operation == 'review' && inputs.enable_review == 'true') || (inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true')) && needs.validate-provider-mode.outputs.active_provider == 'openrouter'
    concurrency:
      # OpenRouter shares the provider review group with cloud/local so a newer
      # review for the same PR cancels any in-flight provider-mode review.
      group: reviewsensei-provider-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (needs.authoritative-preflight.outputs.pull_request_number || github.event.pull_request.number || github.run_id) || github.run_id }}
      cancel-in-progress: ${{ inputs.operation == 'review' }}
    # Public reusable workflow: GitHub-hosted compute for cloud/OpenRouter matches
    # the `cloud` job.
    runs-on: ubuntu-latest
    # Same permission set as cloud/local. GitHub writes go through the OIDC
    # broker inside `review-sensei github review` / `github reply`; this job
    # does not grant pull-requests:write or issues:write to GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authoritative-preflight.outputs.base_sha || inputs.base_sha || inputs.base_ref }}
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          version_pattern = re.compile(r"^v?[0-9]+\.[0-9]+\.[0-9]+$")

          def valid_ref(value: str) -> bool:
              return bool(
                  value
                  and not value.startswith("-")
                  and "--" not in value
                  and not value.endswith("-")
                  and ref_pattern.fullmatch(value)
              )

          if os.environ.get("MODE") not in {"automatic", "manual"}:
              raise SystemExit("workflow mode is invalid")
          if os.environ.get("OPERATION") not in {"review", "reply"}:
              raise SystemExit("workflow operation is invalid")
          if os.environ.get("PROVIDER_MODE") != "openrouter":
              raise SystemExit("openrouter job received an invalid provider mode")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          base_ref = os.environ.get("BASE_REF", "")
          if not valid_ref(base_ref):
              raise SystemExit("BASE_REF input is invalid")
          head_ref = os.environ.get("HEAD_REF", "")
          if os.environ.get("OPERATION") == "review" and not valid_ref(head_ref):
              raise SystemExit("HEAD_REF input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if os.environ.get("OPERATION") == "review" and not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          if not version_pattern.fullmatch(os.environ.get("REVIEW_SENSEI_VERSION", "")):
              raise SystemExit("ReviewSensei version must be exact")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@refs/tags/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a public git tag." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check --upgrade pip 2>&1 | tee "$pypi_log" && \
            "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee -a "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            source_dir="$RUNNER_TEMP/review-sensei-workflow-source"
            rm -rf "$source_dir"
            git init --bare "$source_dir"
            git --git-dir="$source_dir" fetch --depth=1 \
              https://github.com/malsabbagh/review-sensei.git \
              "$REVIEW_SENSEI_WORKFLOW_SHA"
            object_type="$(git --git-dir="$source_dir" cat-file -t "$REVIEW_SENSEI_WORKFLOW_SHA")"
            if [[ "$object_type" == "tag" ]]; then
              REVIEW_SENSEI_WORKFLOW_SHA="$(git --git-dir="$source_dir" rev-parse "${REVIEW_SENSEI_WORKFLOW_SHA}^{commit}")"
            elif [[ "$object_type" != "commit" ]]; then
              echo "::error::The ReviewSensei workflow SHA is not a commit or an annotated tag." >&2
              exit 1
            fi
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Prepare bounded trusted-base diff
        if: inputs.operation == 'review'
        env:
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then
            args+=(--head-repository "$HEAD_REPOSITORY")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000

      - name: Decide whether the automatic review budget is already spent
        id: budget-admission
        if: inputs.operation == 'review' && inputs.enable_review == 'true'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ENABLE_GITHUB_WRITES: ${{ inputs.enable_github_writes }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::review budget repository is invalid' >&2; exit 1; }
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget repository id is invalid' >&2; exit 1; }
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget pull request is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::review budget head is invalid' >&2; exit 1; }
          comments_file="$RUNNER_TEMP/review-sensei-issue-comments.json"
          page_dir="$RUNNER_TEMP/review-sensei-comment-pages"
          rm -rf "$page_dir"
          mkdir -p "$page_dir"
          page=1
          while [[ "$page" -le 10 ]]; do
            if ! GH_TOKEN="$GH_READ_TOKEN" gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments?per_page=100&page=${page}" >"$page_dir/$page.json"; then
              echo '::error::review budget ledger could not be read' >&2
              exit 1
            fi
            count="$("$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print(len(value) if isinstance(value, list) else -1)' "$page_dir/$page.json")"
            if [[ "$count" -lt 0 ]]; then
              echo '::error::review budget comment page is invalid' >&2
              exit 1
            fi
            if [[ "$count" -lt 100 ]]; then
              break
            fi
            if [[ "$page" -eq 10 ]]; then
              echo '::error::review budget comments exceed the configured bound' >&2
              exit 1
            fi
            page=$((page + 1))
          done
          PAGE_DIR="$page_dir" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission assemble
          decision="$(REPOSITORY="$REPOSITORY" REPOSITORY_ID="$REPOSITORY_ID" PULL_REQUEST="$PULL_REQUEST" HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission decide)"
          if [[ "$decision" == "review" ]]; then
            echo "spent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$decision" != "spent" ]]; then
            echo '::error::review budget decision was invalid' >&2
            exit 1
          fi
          echo "spent=true" >> "$GITHUB_OUTPUT"
          notice_state="$(HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission notice-status)"
          if [[ "$notice_state" == "posted" ]]; then
            echo "spent-budget notice already posted"
            exit 0
          fi
          if [[ "$ENABLE_GITHUB_WRITES" != "true" ]]; then
            echo "automatic review budget is spent; github writes are disabled, skipping the notice"
            exit 0
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "automatic review budget is spent; Actions OIDC token is unavailable, skipping the notice"
            exit 0
          fi
          notice_file="$RUNNER_TEMP/review-sensei-budget-notice.txt"
          HEAD_SHA="$HEAD_SHA" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission render-notice "$notice_file"
          oidc_response="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.reviewsensei.dev")"
          oidc_token="$(printf '%s' "$oidc_response" | "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value)')"
          broker_body="$(OIDC_TOKEN="$oidc_token" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; print(json.dumps({"oidc_token": os.environ["OIDC_TOKEN"], "capability": "issue_reply"}))')"
          unset oidc_token
          broker_response="$(curl --fail --silent --show-error -H "Content-Type: application/json" -H "Accept: application/json" --data "$broker_body" https://github.reviewsensei.dev/github/token)"
          unset broker_body
          reply_token="$(BROKER_RESPONSE="$broker_response" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; value=json.loads(os.environ["BROKER_RESPONSE"]).get("token"); assert isinstance(value,str) and value.strip(); print(value)')"
          unset broker_response
          GH_TOKEN="$reply_token" gh api --method POST -H "Accept: application/vnd.github+json" "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments" -f body="$(cat "$notice_file")" >/dev/null
          unset reply_token
          echo "automatic review budget is spent; skipping the review CLI"

      - name: Run OpenRouter-provider review
        id: provider-review
        if: inputs.operation == 'review' && inputs.enable_review == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true'
        env:
          REPOSITORY_ID: ${{ inputs.repository_id }}
          MODE: ${{ inputs.mode }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_DEFAULT: deepseek/deepseek-v4.1-flash
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          TITLE_B64: ${{ needs.authoritative-preflight.outputs.pull_request_title_b64 }}
          STAGES_DIR: ${{ inputs.stages_dir }}
          CATEGORIES_DIR: ${{ inputs.categories_dir }}
          LEARNING_PROPOSALS: ${{ inputs.enable_learning_proposals }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo '::error::OPENROUTER_API_KEY is required for OpenRouter mode' >&2
            exit 1
          fi
          VALIDATED_MODEL="$("$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", "openrouter"),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          print(resolved, end="")
          PY
          )"
          unset OPENROUTER_UPSTREAM_PROVIDER
          OPENROUTER_RESOLVED="$("$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" resolve-hosted-openrouter both)" || {
            echo '::error::hosted OpenRouter resolution failed' >&2
            exit 1
          }
          MODEL="${OPENROUTER_RESOLVED%%$'\t'*}"
          OPENROUTER_UPSTREAM_PROVIDER="${OPENROUTER_RESOLVED#*$'\t'}"
          if [[ "$MODEL" != "$VALIDATED_MODEL" ]]; then
            echo '::error::resolved hosted OpenRouter model does not match workflow env' >&2
            exit 1
          fi
          export MODEL OPENROUTER_UPSTREAM_PROVIDER
          if [[ -n "$TITLE_B64" && ( ${#TITLE_B64} -gt 8192 || ! "$TITLE_B64" =~ ^[A-Za-z0-9+/=]+$ ) ]]; then
            echo '::error::authoritative pull-request title output is invalid' >&2
            exit 1
          fi
          TITLE=""
          if [[ -n "$TITLE_B64" ]] && ! TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode)"; then
            echo '::error::authoritative pull-request title output could not be decoded' >&2
            exit 1
          fi
          review_args=(--diff pr.patch --repository "$REPOSITORY" --pull-request "$PULL_REQUEST")
          review_args+=(--review-mode "$REVIEW_MODE")
          if [[ -n "$TITLE" ]]; then review_args+=(--title "$TITLE"); fi
          if [[ -n "$STAGES_DIR" ]]; then review_args+=(--stages-dir "$STAGES_DIR"); fi
          if [[ -n "$CATEGORIES_DIR" ]]; then review_args+=(--categories-dir "$CATEGORIES_DIR"); fi
          if [[ "$LEARNING_PROPOSALS" != "true" ]]; then review_args+=(--no-learning-proposals); fi
          if [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--head-sha "$HEAD_SHA"); fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--base-sha "$BASE_SHA"); fi
          if [[ "$UPLOAD_ARTIFACTS" == "true" ]]; then
            review_args+=(--recovery-artifact recovery-artifact.json)
          fi
          # Reserve the round, checkpoint the identity-bound transaction, and
          # emit the trusted admission artifacts before inference results are
          # published. The transaction lives in the broker-attested comment
          # ledger rather than a runner-local file, so the publication step of
          # this run and the analysis of the next run read the same durable
          # rounds, baselines, and grants.
          review_args+=(--transaction --github-session-ledger \
            --repository-id "$REPOSITORY_ID" \
            --configuration-context-output configuration-context.json \
            --admission-context-output admission-context.json)
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" "${review_args[@]}" \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --provider openrouter --model "$MODEL" \
            --output review.json --outcome outcome.json

      - name: Confirm live pull-request head is still current
        id: publish-admission
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          live_sha=""
          for attempt in 1 2 3; do
            err_file="$RUNNER_TEMP/rs-head-revalidate.$$"
            if live_sha="$(gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha' 2>"$err_file")"; then
              rm -f "$err_file"
              break
            fi
            err_text="$(tr -d '\000' <"$err_file" | tail -n 20)"
            rm -f "$err_file"
            if [[ "$err_text" =~ HTTP\ (401|403|404) ]]; then
              echo '::error::live pull-request head revalidation was unauthorized or missing; refusing publish' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::live pull-request head revalidation was unavailable; refusing publish' >&2
              exit 1
            fi
            delay=$((1 << (attempt - 1)))
            if [[ "$err_text" =~ HTTP\ 429 ]]; then
              delay=$((delay * 2))
            fi
            if [[ "$delay" -gt 8 ]]; then
              delay=8
            fi
            jitter_hundredths=$((RANDOM % 50))
            sleep "${delay}.${jitter_hundredths}"
          done
          if [[ ! "$live_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::live pull-request head identity is invalid; refusing publish' >&2
            exit 1
          fi
          if [[ "$live_sha" != "$HEAD_SHA" ]]; then
            echo '::error::publish skipped_stale: reviewed head is no longer the live pull-request head' >&2
            echo 'skipped_stale'
            echo 'status=skipped_stale' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish admission current'
          echo 'status=current' >> "$GITHUB_OUTPUT"

      - name: Publish or promote validated review through the broker
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required' && steps.publish-admission.outputs.status == 'current'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          LEARNING_PRS: ${{ inputs.enable_learning_prs }}
          AUTO_APPROVE: ${{ inputs.enable_auto_approve }}
          REVIEW_MODE: ${{ inputs.review_mode }}
        run: |
          publish_args=()
          if [[ "$ENABLE_REVIEW" == "true" ]]; then
            publish_args+=(--enable-review)
          fi
          if [[ "$LEARNING_PRS" == "true" ]]; then
            publish_args+=(--enable-learning-prs)
          fi
          if [[ "$AUTO_APPROVE" == "true" ]]; then
            publish_args+=(--enable-auto-approve)
          elif [[ "$AUTO_APPROVE" == "false" ]]; then
            publish_args+=(--no-auto-approve)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --outcome publication-outcome.json --github-session-ledger \
            --configuration-context configuration-context.json \
            --admission-context admission-context.json \
            --review-mode "$REVIEW_MODE" --allow-write "${publish_args[@]}"

      - name: Generate and publish OpenRouter mention reply
        id: reply
        # Approval finalization is inside `github reply`, matching cloud/local:
        # it re-reads the persisted eligibility of the review published for
        # this head. There is no separate YAML finalizer step.
        if: inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true'
        env:
          MODE: ${{ inputs.mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_DEFAULT: deepseek/deepseek-v4.1-flash
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo '::error::OPENROUTER_API_KEY is required for OpenRouter mode' >&2
            exit 1
          fi
          VALIDATED_MODEL="$("$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", "openrouter"),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          print(resolved, end="")
          PY
          )"
          unset OPENROUTER_UPSTREAM_PROVIDER
          OPENROUTER_RESOLVED="$("$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" resolve-hosted-openrouter both)" || {
            echo '::error::hosted OpenRouter resolution failed' >&2
            exit 1
          }
          MODEL="${OPENROUTER_RESOLVED%%$'\t'*}"
          OPENROUTER_UPSTREAM_PROVIDER="${OPENROUTER_RESOLVED#*$'\t'}"
          if [[ "$MODEL" != "$VALIDATED_MODEL" ]]; then
            echo '::error::resolved hosted OpenRouter model does not match workflow env' >&2
            exit 1
          fi
          export MODEL OPENROUTER_UPSTREAM_PROVIDER
          reply_output="$RUNNER_TEMP/review-sensei-reply-status"
          set +e
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            --generate --provider openrouter --model "$MODEL" \
            --repository "$REPOSITORY" --pull-request "$PULL_REQUEST" \
            --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply > "$reply_output"
          reply_exit=$?
          set -e
          reply_status="$(grep -E '^(replied_and_resolved|already_replied_and_resolved|replied|already_replied|skipped_source_gone|skipped_no_mention|skipped_unauthorized|skipped_edited_source|skipped_pr_state|skipped_stale_head|skipped_fork)$' "$reply_output" | tail -n 1 || true)"
          echo "$reply_status"
          if [[ "$reply_exit" -ne 0 ]]; then
            echo "::error::mention reply command failed (exit $reply_exit)" >&2
            exit 1
          fi
          case "$reply_status" in
            replied_and_resolved|already_replied_and_resolved)
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              ;;
            replied|already_replied|skipped_source_gone|skipped_no_mention|\
              skipped_unauthorized|skipped_edited_source|skipped_pr_state|\
              skipped_stale_head|skipped_fork)
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected mention reply status: $reply_status" >&2
              exit 1
              ;;
          esac

      - name: Verify mention reply completed
        if: >-
          always() && inputs.operation == 'reply' &&
          inputs.enable_github_writes == 'true' &&
          inputs.enable_mention_replies == 'true' &&
          steps.reply.outcome != 'success'
        run: |
          echo '::error::mention reply step did not complete successfully' >&2
          exit 1

      - name: Upload opt-in review artifact
        if: inputs.operation == 'review' && inputs.upload_artifacts == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-review
          path: |
            review.json
            outcome.json
            recovery-artifact.json
          if-no-files-found: error
          retention-days: 7

  local:
    needs: [validate-provider-mode, authoritative-preflight]
    if: ((inputs.operation == 'review' && inputs.enable_review == 'true') || (inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true')) && needs.validate-provider-mode.outputs.active_provider == 'local'
    concurrency:
      # Keep this key byte-for-byte equivalent to the cloud job. A newer
      # review therefore cancels any older provider-mode review for the same
      # PR, while each mention reply remains isolated to its triggering run.
      group: reviewsensei-provider-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (needs.authoritative-preflight.outputs.pull_request_number || github.event.pull_request.number || github.run_id) || github.run_id }}
      cancel-in-progress: ${{ inputs.operation == 'review' }}
    runs-on: [self-hosted, linux, x64, ollama]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authoritative-preflight.outputs.base_sha || inputs.base_sha || inputs.base_ref }}
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode || 'local-ollama' }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          version_pattern = re.compile(r"^v?[0-9]+\.[0-9]+\.[0-9]+$")

          def valid_ref(value: str) -> bool:
              return bool(
                  value
                  and not value.startswith("-")
                  and "--" not in value
                  and not value.endswith("-")
                  and ref_pattern.fullmatch(value)
              )

          if os.environ.get("MODE") not in {"automatic", "manual"}:
              raise SystemExit("workflow mode is invalid")
          if os.environ.get("OPERATION") not in {"review", "reply"}:
              raise SystemExit("workflow operation is invalid")
          if os.environ.get("PROVIDER_MODE") not in {"local", "local-ollama"}:
              raise SystemExit("local job received an invalid provider mode")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          base_ref = os.environ.get("BASE_REF", "")
          if not valid_ref(base_ref):
              raise SystemExit("BASE_REF input is invalid")
          head_ref = os.environ.get("HEAD_REF", "")
          if os.environ.get("OPERATION") == "review" and not valid_ref(head_ref):
              raise SystemExit("HEAD_REF input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if os.environ.get("OPERATION") == "review" and not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          if not version_pattern.fullmatch(os.environ.get("REVIEW_SENSEI_VERSION", "")):
              raise SystemExit("ReviewSensei version must be exact")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ inputs.review_sensei_version }}
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@refs/tags/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a public git tag." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            source_dir="$RUNNER_TEMP/review-sensei-workflow-source"
            rm -rf "$source_dir"
            git init --bare "$source_dir"
            git --git-dir="$source_dir" fetch --depth=1 \
              https://github.com/malsabbagh/review-sensei.git \
              "$REVIEW_SENSEI_WORKFLOW_SHA"
            object_type="$(git --git-dir="$source_dir" cat-file -t "$REVIEW_SENSEI_WORKFLOW_SHA")"
            if [[ "$object_type" == "tag" ]]; then
              REVIEW_SENSEI_WORKFLOW_SHA="$(git --git-dir="$source_dir" rev-parse "${REVIEW_SENSEI_WORKFLOW_SHA}^{commit}")"
            elif [[ "$object_type" != "commit" ]]; then
              echo "::error::The ReviewSensei workflow SHA is not a commit or an annotated tag." >&2
              exit 1
            fi
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_SHA."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_SHA"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Decide whether the automatic review budget is already spent
        id: budget-admission
        if: inputs.operation == 'review' && inputs.enable_review == 'true'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ENABLE_GITHUB_WRITES: ${{ inputs.enable_github_writes }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::review budget repository is invalid' >&2; exit 1; }
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget repository id is invalid' >&2; exit 1; }
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::review budget pull request is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::review budget head is invalid' >&2; exit 1; }
          comments_file="$RUNNER_TEMP/review-sensei-issue-comments.json"
          page_dir="$RUNNER_TEMP/review-sensei-comment-pages"
          rm -rf "$page_dir"
          mkdir -p "$page_dir"
          page=1
          while [[ "$page" -le 10 ]]; do
            if ! GH_TOKEN="$GH_READ_TOKEN" gh api "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments?per_page=100&page=${page}" >"$page_dir/$page.json"; then
              echo '::error::review budget ledger could not be read' >&2
              exit 1
            fi
            count="$("$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print(len(value) if isinstance(value, list) else -1)' "$page_dir/$page.json")"
            if [[ "$count" -lt 0 ]]; then
              echo '::error::review budget comment page is invalid' >&2
              exit 1
            fi
            if [[ "$count" -lt 100 ]]; then
              break
            fi
            if [[ "$page" -eq 10 ]]; then
              echo '::error::review budget comments exceed the configured bound' >&2
              exit 1
            fi
            page=$((page + 1))
          done
          PAGE_DIR="$page_dir" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission assemble
          decision="$(REPOSITORY="$REPOSITORY" REPOSITORY_ID="$REPOSITORY_ID" PULL_REQUEST="$PULL_REQUEST" HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission decide)"
          if [[ "$decision" == "review" ]]; then
            echo "spent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$decision" != "spent" ]]; then
            echo '::error::review budget decision was invalid' >&2
            exit 1
          fi
          echo "spent=true" >> "$GITHUB_OUTPUT"
          notice_state="$(HEAD_SHA="$HEAD_SHA" COMMENTS_FILE="$comments_file" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission notice-status)"
          if [[ "$notice_state" == "posted" ]]; then
            echo "spent-budget notice already posted"
            exit 0
          fi
          if [[ "$ENABLE_GITHUB_WRITES" != "true" ]]; then
            echo "automatic review budget is spent; github writes are disabled, skipping the notice"
            exit 0
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "automatic review budget is spent; Actions OIDC token is unavailable, skipping the notice"
            exit 0
          fi
          notice_file="$RUNNER_TEMP/review-sensei-budget-notice.txt"
          HEAD_SHA="$HEAD_SHA" "$RUNNER_TEMP/review-sensei-venv/bin/python" -m review_sensei.hosting.github.budget_admission render-notice "$notice_file"
          oidc_response="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.reviewsensei.dev")"
          oidc_token="$(printf '%s' "$oidc_response" | "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,sys; value=json.load(sys.stdin).get("value"); assert isinstance(value,str) and value.strip(); print(value)')"
          broker_body="$(OIDC_TOKEN="$oidc_token" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; print(json.dumps({"oidc_token": os.environ["OIDC_TOKEN"], "capability": "issue_reply"}))')"
          unset oidc_token
          broker_response="$(curl --fail --silent --show-error -H "Content-Type: application/json" -H "Accept: application/json" --data "$broker_body" https://github.reviewsensei.dev/github/token)"
          unset broker_body
          reply_token="$(BROKER_RESPONSE="$broker_response" "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json,os; value=json.loads(os.environ["BROKER_RESPONSE"]).get("token"); assert isinstance(value,str) and value.strip(); print(value)')"
          unset broker_response
          GH_TOKEN="$reply_token" gh api --method POST -H "Accept: application/vnd.github+json" "repos/${REPOSITORY}/issues/${PULL_REQUEST}/comments" -f body="$(cat "$notice_file")" >/dev/null
          unset reply_token
          echo "automatic review budget is spent; skipping the review CLI"

      - name: Prepare and run trusted local review
        id: provider-review
        if: inputs.operation == 'review' && inputs.enable_review == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true'
        env:
          REPOSITORY_ID: ${{ inputs.repository_id }}
          MODE: ${{ inputs.mode }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_MODEL: ${{ vars.REVIEWSENSEI_LOCAL_MODEL }}
          BACKEND_DEFAULT: qwen3.5:4b
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          OLLAMA_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model || vars.REVIEWSENSEI_MODEL || vars.REVIEWSENSEI_LOCAL_MODEL || 'qwen3.5:4b' }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          TITLE_B64: ${{ needs.authoritative-preflight.outputs.pull_request_title_b64 }}
          STAGES_DIR: ${{ inputs.stages_dir }}
          CATEGORIES_DIR: ${{ inputs.categories_dir }}
          LEARNING_PROPOSALS: ${{ inputs.enable_learning_proposals }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then args+=(--head-repository "$HEAD_REPOSITORY"); fi
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", ""),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          if resolved != os.environ["OLLAMA_MODEL"]:
              print(
                  "::error::resolved hosted model does not match workflow env",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null
          ollama show "$OLLAMA_MODEL" >/dev/null
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000
          if [[ -n "$TITLE_B64" && ( ${#TITLE_B64} -gt 8192 || ! "$TITLE_B64" =~ ^[A-Za-z0-9+/=]+$ ) ]]; then
            echo '::error::authoritative pull-request title output is invalid' >&2
            exit 1
          fi
          TITLE=""
          if [[ -n "$TITLE_B64" ]] && ! TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode)"; then
            echo '::error::authoritative pull-request title output could not be decoded' >&2
            exit 1
          fi
          review_args=(--diff pr.patch --repository "$REPOSITORY" --pull-request "$PULL_REQUEST")
          review_args+=(--review-mode "$REVIEW_MODE")
          if [[ -n "$TITLE" ]]; then review_args+=(--title "$TITLE"); fi
          if [[ -n "$STAGES_DIR" ]]; then review_args+=(--stages-dir "$STAGES_DIR"); fi
          if [[ -n "$CATEGORIES_DIR" ]]; then review_args+=(--categories-dir "$CATEGORIES_DIR"); fi
          if [[ "$LEARNING_PROPOSALS" != "true" ]]; then review_args+=(--no-learning-proposals); fi
          if [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--head-sha "$HEAD_SHA"); fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--base-sha "$BASE_SHA"); fi
          if [[ "$UPLOAD_ARTIFACTS" == "true" ]]; then
            review_args+=(--recovery-artifact recovery-artifact.json)
          fi
          # Reserve the round, checkpoint the identity-bound transaction, and
          # emit the trusted admission artifacts before inference results are
          # published. The transaction lives in the broker-attested comment
          # ledger rather than a runner-local file, so the publication step of
          # this run and the analysis of the next run read the same durable
          # rounds, baselines, and grants.
          review_args+=(--transaction --github-session-ledger \
            --repository-id "$REPOSITORY_ID" \
            --configuration-context-output configuration-context.json \
            --admission-context-output admission-context.json)
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" "${review_args[@]}" \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --base-url http://127.0.0.1:11434/api --model "$OLLAMA_MODEL" \
            --output review.json --outcome outcome.json

      # success() && !cancelled() skips a pointless API call after a failed
      # provider step or cancelled run. Publish still has its own cancellation
      # guard and requires status=current from this head check.
      - name: Confirm live pull-request head is still current
        id: publish-admission
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          live_sha=""
          for attempt in 1 2 3; do
            err_file="$RUNNER_TEMP/rs-head-revalidate.$$"
            if live_sha="$(gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha' 2>"$err_file")"; then
              rm -f "$err_file"
              break
            fi
            err_text="$(tr -d '\000' <"$err_file" | tail -n 20)"
            rm -f "$err_file"
            if [[ "$err_text" =~ HTTP\ (401|403|404) ]]; then
              echo '::error::live pull-request head revalidation was unauthorized or missing; refusing publish' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::live pull-request head revalidation was unavailable; refusing publish' >&2
              exit 1
            fi
            delay=$((1 << (attempt - 1)))
            if [[ "$err_text" =~ HTTP\ 429 ]]; then
              delay=$((delay * 2))
            fi
            if [[ "$delay" -gt 8 ]]; then
              delay=8
            fi
            jitter_hundredths=$((RANDOM % 50))
            sleep "${delay}.${jitter_hundredths}"
          done
          if [[ ! "$live_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::live pull-request head identity is invalid; refusing publish' >&2
            exit 1
          fi
          if [[ "$live_sha" != "$HEAD_SHA" ]]; then
            echo '::error::publish skipped_stale: reviewed head is no longer the live pull-request head' >&2
            echo 'skipped_stale'
            echo 'status=skipped_stale' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish admission current'
          echo 'status=current' >> "$GITHUB_OUTPUT"

      - name: Publish or promote trusted local review and learnings
        if: success() && !cancelled() && inputs.operation == 'review' && inputs.enable_github_writes == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required' && steps.publish-admission.outputs.status == 'current'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          LEARNING_PRS: ${{ inputs.enable_learning_prs }}
          AUTO_APPROVE: ${{ inputs.enable_auto_approve }}
          REVIEW_MODE: ${{ inputs.review_mode }}
        run: |
          publish_args=()
          if [[ "$ENABLE_REVIEW" == "true" ]]; then
            publish_args+=(--enable-review)
          fi
          if [[ "$LEARNING_PRS" == "true" ]]; then
            publish_args+=(--enable-learning-prs)
          fi
          if [[ "$AUTO_APPROVE" == "true" ]]; then
            publish_args+=(--enable-auto-approve)
          elif [[ "$AUTO_APPROVE" == "false" ]]; then
            publish_args+=(--no-auto-approve)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --outcome publication-outcome.json --github-session-ledger \
            --configuration-context configuration-context.json \
            --admission-context admission-context.json \
            --review-mode "$REVIEW_MODE" --allow-write "${publish_args[@]}"

      - name: Generate and publish trusted local mention reply
        id: reply
        if: inputs.operation == 'reply' && inputs.enable_github_writes == 'true' && inputs.enable_mention_replies == 'true'
        env:
          MODE: ${{ inputs.mode }}
          PROVIDER_MODE: ${{ needs.validate-provider-mode.outputs.normalized_provider_mode }}
          CALLER_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model }}
          HOSTED_REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
          BACKEND_MODEL: ${{ vars.REVIEWSENSEI_LOCAL_MODEL }}
          BACKEND_DEFAULT: qwen3.5:4b
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          OLLAMA_MODEL: ${{ needs.validate-provider-mode.outputs.normalized_model || vars.REVIEWSENSEI_MODEL || vars.REVIEWSENSEI_LOCAL_MODEL || 'qwen3.5:4b' }}
        run: |
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.errors import ReviewInputError
          from review_sensei.provider_config import validate_resolved_hosted_job_model

          try:
              resolved = validate_resolved_hosted_job_model(
                  provider_mode=os.environ.get("PROVIDER_MODE", ""),
                  workflow_mode=os.environ.get("MODE", ""),
                  caller_model=os.environ.get("CALLER_MODEL", ""),
                  reviewsensei_model=os.environ.get("HOSTED_REVIEWSENSEI_MODEL", ""),
                  backend_model=os.environ.get("BACKEND_MODEL", ""),
                  backend_default=os.environ.get("BACKEND_DEFAULT", ""),
              )
          except ReviewInputError as exc:
              print(f"::error::{exc}", file=sys.stderr)
              raise SystemExit(1) from exc
          if resolved != os.environ["OLLAMA_MODEL"]:
              print(
                  "::error::resolved hosted model does not match workflow env",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:11434/api/tags >/dev/null
          ollama show "$OLLAMA_MODEL" >/dev/null
          reply_output="$RUNNER_TEMP/review-sensei-reply-status"
          set +e
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            --generate --provider ollama --base-url http://127.0.0.1:11434/api \
            --model "$OLLAMA_MODEL" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply > "$reply_output"
          reply_exit=$?
          set -e
          reply_status="$(grep -E '^(replied_and_resolved|already_replied_and_resolved|replied|already_replied|skipped_source_gone|skipped_no_mention|skipped_unauthorized|skipped_edited_source|skipped_pr_state|skipped_stale_head|skipped_fork)$' "$reply_output" | tail -n 1 || true)"
          echo "$reply_status"
          if [[ "$reply_exit" -ne 0 ]]; then
            echo "::error::mention reply command failed (exit $reply_exit)" >&2
            exit 1
          fi
          case "$reply_status" in
            replied_and_resolved|already_replied_and_resolved)
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              ;;
            replied|already_replied|skipped_source_gone|skipped_no_mention|\
              skipped_unauthorized|skipped_edited_source|skipped_pr_state|\
              skipped_stale_head|skipped_fork)
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected mention reply status: $reply_status" >&2
              exit 1
              ;;
          esac

      - name: Verify mention reply completed
        if: >-
          always() && inputs.operation == 'reply' &&
          inputs.enable_github_writes == 'true' &&
          inputs.enable_mention_replies == 'true' &&
          steps.reply.outcome != 'success'
        run: |
          echo '::error::mention reply step did not complete successfully' >&2
          exit 1

      - name: Upload opt-in review artifact
        if: inputs.operation == 'review' && inputs.upload_artifacts == 'true' && steps.budget-admission.outcome == 'success' && steps.budget-admission.outputs.spent != 'true' && steps.provider-review.outputs.outcome_status != 'action_required'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-review
          path: |
            review.json
            outcome.json
            recovery-artifact.json
          if-no-files-found: error
          retention-days: 7

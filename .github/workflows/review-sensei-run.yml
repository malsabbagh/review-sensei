name: ReviewSensei reusable runner

# This is the public reusable workflow. Setup callers use the
# operator-managed v5 git tag as their update channel. The OIDC broker resolves
# that tag at capability-exchange time and requires the executing workflow SHA
# to match it. PyPI remains the primary package channel; the source fallback
# installs the executing workflow commit SHA directly.
#
# The workflow is deliberately thin. It owns events, runners, jobs,
# concurrency, permissions, secret injection, and exact package installation.
# Everything else is a package decision:
#
#  * A read-only bootstrap freezes the trusted policy commit (the repository
#    default branch, never the pull-request head), installs the exact package
#    release this workflow commit belongs to, and asks the package for one
#    hosted plan.
#  * Every provider job consumes only that plan: runner requirement, backend,
#    model, endpoint, credential reference, and github policy. Backend
#    defaults, classification, count arithmetic, markdown assembly, and
#    approval eligibility are never restated here.
#  * Only two optional Actions variables exist: REVIEWSENSEI_PROVIDER and
#    REVIEWSENSEI_MODEL. They are mapped into the package resolver exactly
#    once, in the bootstrap plan step, and nowhere else.
on:
  workflow_call:
    inputs:
      mode:
        # automatic: an eligible host event may start a review, subject to the
        # plan's github.automatic_reviews. manual: an explicit dispatch, which
        # stays independently available. Both are invocation data, not a
        # second configuration hierarchy.
        required: true
        type: string
      operation:
        required: false
        default: review
        type: string
      repository:
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_ref:
        required: true
        type: string
      head_repository:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      source_kind:
        required: false
        default: issue
        type: string
      source_comment_id:
        required: false
        type: string
      source_updated_at:
        required: false
        type: string
      root_comment_id:
        required: false
        type: string
      comment_body:
        required: false
        default: ''
        type: string
      comment_actor:
        required: false
        default: ''
        type: string
      comment_actor_type:
        # No default: a command caller must state the actor type explicitly so
        # an omitted value fails the maintainer gate instead of silently
        # satisfying it.
        required: false
        default: ''
        type: string
      comment_association:
        required: false
        default: ''
        type: string
    secrets:
      # Only named required secrets are declared. There is no `secrets:
      # inherit`, no credential in YAML, and no provider credential is ever
      # sent to the Worker. The broker remains the only write-capability
      # exchange. A credential's presence never authorizes writes or
      # inference: github.writes decides writes, and the plan decides
      # inference.
      OLLAMA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

concurrency:
  # Use only host-provided identities in the group key.  In particular, do not
  # interpolate the optional pull_request_number input: workflow-level
  # concurrency is evaluated before any validation job can reject it. A
  # pull_request event gets latest-wins cancellation per PR. Reply events
  # (including pull_request_review_comment) always use their unique run id so
  # one reply can never replace another reply for the same PR. Manual reviews
  # have no host PR identity at workflow-concurrency time and fall back to the
  # unique run id; provider-level concurrency below joins them by the
  # authoritative PR number after preflight.
  group: reviewsensei-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (github.event.pull_request.number || github.run_id) || github.run_id }}
  cancel-in-progress: ${{ inputs.operation == 'review' && github.event.pull_request.number != null }}

jobs:
  bootstrap:
    # opened/synchronize/reopened still fire for drafts. Skip those review runs
    # so they are not failed by later eligibility checks; ready_for_review and
    # non-pull_request operations continue.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Read-only. The bootstrap reads the trusted policy commit, installs the
    # exact released package, and reports the plan; it holds no write scope and
    # never materializes a provider credential.
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      model: ${{ steps.plan.outputs.model }}
      base_url: ${{ steps.plan.outputs.base_url }}
      runner_kind: ${{ steps.plan.outputs.runner_kind }}
      credential_env: ${{ steps.plan.outputs.credential_env }}
      credential_required: ${{ steps.plan.outputs.credential_required }}
      inference_location: ${{ steps.plan.outputs.inference_location }}
      upstream_provider: ${{ steps.plan.outputs.upstream_provider }}
      automatic_reviews: ${{ steps.plan.outputs.automatic_reviews }}
      writes: ${{ steps.plan.outputs.writes }}
      reviews: ${{ steps.plan.outputs.reviews }}
      mentions: ${{ steps.plan.outputs.mentions }}
      learning: ${{ steps.plan.outputs.learning }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      configuration_source: ${{ steps.plan.outputs.configuration_source }}
      package_version: ${{ steps.release-identity.outputs.package_version }}
      workflow_commit: ${{ steps.release-identity.outputs.workflow_commit }}
      policy_commit: ${{ steps.policy.outputs.commit }}
    steps:
      - name: Reject unsupported invocation inputs
        id: reject-unsupported-invocation
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request_number }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_ACTOR: ${{ inputs.comment_actor }}
          COMMENT_ACTOR_TYPE: ${{ inputs.comment_actor_type }}
          COMMENT_ASSOCIATION: ${{ inputs.comment_association }}
        run: |
          set -euo pipefail
          # Invocation data only: the workflow validates what a caller passes
          # and refuses to guess. Backend, model, endpoint, credential, and
          # policy are resolved by the package from .reviewsensei.yml and the
          # documented packaged defaults; none of them is an input here.
          case "$OPERATION" in
            review|reply|command) ;;
            *) echo '::error::operation must be review, reply, or command' >&2; exit 1 ;;
          esac
          case "$MODE" in
            automatic|manual) ;;
            *) echo '::error::workflow mode must be automatic or manual' >&2; exit 1 ;;
          esac
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo '::error::repository input is invalid' >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::repository id must be a positive decimal integer' >&2
            exit 1
          fi
          if [[ -z "$BASE_REF" || "$BASE_REF" == -* || "$BASE_REF" == *--* || "$BASE_REF" == *- || ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo '::error::base ref input is invalid' >&2
            exit 1
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::base sha input is invalid' >&2
            exit 1
          fi
          if [[ -n "$HEAD_REPOSITORY" && ! "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo '::error::head repository input is invalid' >&2
            exit 1
          fi
          case "$OPERATION" in
            review)
              if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::pull request number is required for review operations' >&2
                exit 1
              fi
              if [[ -z "$HEAD_REF" || "$HEAD_REF" == -* || "$HEAD_REF" == *--* || "$HEAD_REF" == *- || ! "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo '::error::head ref input is invalid' >&2
                exit 1
              fi
              if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
                echo '::error::head sha is required for review operations' >&2
                exit 1
              fi
              ;;
            reply)
              if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::pull request number is required for reply operations' >&2
                exit 1
              fi
              ;;
            command)
              # Command inputs are checked whether or not the selected policy
              # authorizes writes, so a caller cannot route command payloads
              # through the workflow while the job that consumes them is
              # skipped.
              # LC_ALL=C pins wc to byte counting instead of the runner locale.
              comment_body_bytes="$(printf '%s' "$COMMENT_BODY" | LC_ALL=C wc -c)"
              if [[ ! "$INPUT_PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::command operations require an explicit pull_request_number input' >&2
                exit 1
              fi
              if [[ ! "$PULL_REQUEST" =~ ^[1-9][0-9]*$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ || ! "$SOURCE_COMMENT_ID" =~ ^[1-9][0-9]*$ || -z "$COMMENT_BODY" || "$comment_body_bytes" -gt 4096 || -z "$COMMENT_ACTOR" || ${#COMMENT_ACTOR} -gt 256 ]]; then
                echo '::error::command operations require a pull request, current head SHA, and source comment identity' >&2
                exit 1
              fi
              if [[ "$COMMENT_ACTOR_TYPE" != "User" || ! "$COMMENT_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
                echo '::error::command operations require an authorized human maintainer' >&2
                exit 1
              fi
              ;;
          esac

      - name: Check out the trusted policy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository default branch is the integration channel: a
          # reviewed merge is what changes host policy, so a pull request can
          # never grant itself github.writes or select its own backend. The
          # exact reviewed base/head is frozen separately by the provider jobs.
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the trusted policy commit
        id: policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: trusted-policy
        run: |
          set -euo pipefail
          policy_commit="$(git rev-parse HEAD)"
          if [[ ! "$policy_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::the trusted policy commit is invalid' >&2
            exit 1
          fi
          echo "commit=$policy_commit" >> "$GITHUB_OUTPUT"
          echo "Trusted policy commit $policy_commit resolved from $DEFAULT_BRANCH."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Resolve the exact package release
        id: release-identity
        env:
          REVIEW_SENSEI_WORKFLOW_REF: ${{ job.workflow_ref }}
          REVIEW_SENSEI_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # The installed artifact selects its engine version: the release
          # identity is the workflow commit this run executes, resolved to the
          # exact version that commit declares. Repository YAML cannot install
          # or update the binary, and no `latest` fallback exists.
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_REF" =~ ^malsabbagh/review-sensei/\.github/workflows/review-sensei-run\.yml@refs/tags/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow must run from a public git tag." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei reusable workflow SHA is invalid." >&2
            exit 1
          fi
          source_dir="$RUNNER_TEMP/review-sensei-workflow-source"
          rm -rf "$source_dir"
          git init --bare "$source_dir"
          git --git-dir="$source_dir" fetch --depth=1 \
            https://github.com/malsabbagh/review-sensei.git \
            "$REVIEW_SENSEI_WORKFLOW_SHA"
          object_type="$(git --git-dir="$source_dir" cat-file -t "$REVIEW_SENSEI_WORKFLOW_SHA")"
          if [[ "$object_type" == "tag" ]]; then
            workflow_commit="$(git --git-dir="$source_dir" rev-parse "${REVIEW_SENSEI_WORKFLOW_SHA}^{commit}")"
          elif [[ "$object_type" == "commit" ]]; then
            workflow_commit="$REVIEW_SENSEI_WORKFLOW_SHA"
          else
            echo "::error::The ReviewSensei workflow SHA is not a commit or an annotated tag." >&2
            exit 1
          fi
          package_version="$(git --git-dir="$source_dir" show "$workflow_commit:pyproject.toml" | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([0-9][0-9.]*\)"[[:space:]]*$/\1/p' | head -n 1)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The ReviewSensei workflow commit does not declare an exact released version." >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "workflow_commit=$workflow_commit" >> "$GITHUB_OUTPUT"
          echo "ReviewSensei release identity: review-sensei==$package_version at $workflow_commit."

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ steps.release-identity.outputs.package_version }}
          REVIEW_SENSEI_WORKFLOW_COMMIT: ${{ steps.release-identity.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The ReviewSensei release identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei workflow commit is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check --upgrade pip 2>&1 | tee "$pypi_log" && \
            "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee -a "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_COMMIT."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_COMMIT"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_COMMIT"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Report retired repository variables
        # Retired managed variables are reported here, once per run, with the
        # YAML field that replaces each one. They are never read as
        # configuration: an obsolete value cannot change behavior, it can only
        # produce this annotation. Removal is a separate, authorized cleanup
        # and no credential or unrelated repository setting is touched.
        env:
          REVIEWSENSEI_PROVIDER_MODE: ${{ vars.REVIEWSENSEI_PROVIDER_MODE }}
          REVIEWSENSEI_PROVIDER_PROFILE: ${{ vars.REVIEWSENSEI_PROVIDER_PROFILE }}
          REVIEWSENSEI_LOCAL_MODEL: ${{ vars.REVIEWSENSEI_LOCAL_MODEL }}
          REVIEWSENSEI_CLOUD_MODEL: ${{ vars.REVIEWSENSEI_CLOUD_MODEL }}
          REVIEWSENSEI_REVIEW_MODE: ${{ vars.REVIEWSENSEI_REVIEW_MODE }}
          REVIEWSENSEI_AUTO_REVIEW: ${{ vars.REVIEWSENSEI_AUTO_REVIEW }}
          REVIEWSENSEI_GITHUB_WRITES: ${{ vars.REVIEWSENSEI_GITHUB_WRITES }}
          REVIEWSENSEI_AUTO_APPROVE: ${{ vars.REVIEWSENSEI_AUTO_APPROVE }}
          REVIEWSENSEI_MENTION_REPLIES: ${{ vars.REVIEWSENSEI_MENTION_REPLIES }}
          REVIEWSENSEI_LEARNING_PROPOSALS: ${{ vars.REVIEWSENSEI_LEARNING_PROPOSALS }}
          REVIEWSENSEI_LEARNING_PRS: ${{ vars.REVIEWSENSEI_LEARNING_PRS }}
          REVIEWSENSEI_UPLOAD_ARTIFACTS: ${{ vars.REVIEWSENSEI_UPLOAD_ARTIFACTS }}
          REVIEWSENSEI_STAGES_DIR: ${{ vars.REVIEWSENSEI_STAGES_DIR }}
          REVIEWSENSEI_CATEGORIES_DIR: ${{ vars.REVIEWSENSEI_CATEGORIES_DIR }}
          REVIEWSENSEI_VERSION: ${{ vars.REVIEWSENSEI_VERSION }}
        run: |
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - <<'PY'
          import os
          import sys

          from review_sensei.configuration import retired_environment_remedies

          for name, remedy in retired_environment_remedies(os.environ):
              print(
                  f"::warning::{name} is retired and has no effect; {remedy}",
                  file=sys.stderr,
              )
          PY

      - name: Resolve the hosted plan
        # The only two supported Actions overrides, mapped into one package
        # resolver exactly once. The plan reads .reviewsensei.yml from the
        # frozen trusted policy commit and falls back to the documented
        # packaged backend defaults; nothing is inferred from a secret's
        # presence.
        id: plan
        working-directory: trusted-policy
        env:
          REVIEWSENSEI_PROVIDER: ${{ vars.REVIEWSENSEI_PROVIDER }}
          REVIEWSENSEI_MODEL: ${{ vars.REVIEWSENSEI_MODEL }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" host-plan \
            --github-output "$GITHUB_OUTPUT"

  authoritative-preflight:
    needs: bootstrap
    # Validation is deliberately a dependency.  If the cheap input checks
    # fail, do not make an unnecessary GitHub API request.  Every provider path
    # in this workflow publishes through the broker, so a policy that does not
    # authorize writes performs no host operation at all: it is skipped here,
    # before any API request and before inference, instead of silently
    # switching to stateless enforcement.  Explicit local analysis remains
    # available through the local CLI.
    if: needs.bootstrap.outputs.writes == 'true'
    outputs:
      pull_request_title_b64: ${{ steps.fetch-pr.outputs.pull_request_title_b64 }}
      base_sha: ${{ steps.fetch-pr.outputs.base_sha }}
      pull_request_number: ${{ steps.fetch-pr.outputs.pull_request_number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Validate live pull-request identity before provider execution
        id: fetch-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          # Command mutations reuse the live head/branch checks below, so a
          # stale or fabricated head SHA fails here rather than only at the
          # broker. Reviews need the fetch for their base SHA and title.
          if [[ "$OPERATION" != "command" && "$OPERATION" != "review" ]]; then
            echo 'authoritative PR preflight not required for this operation'
            exit 0
          fi
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::repository id must be a positive decimal integer' >&2; exit 1; }
          [[ -n "$BASE_REF" && "$BASE_REF" != -* && "$BASE_REF" != *--* && "$BASE_REF" != *- && "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo '::error::base ref identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::base sha identity is invalid' >&2
            exit 1
          fi
          payload="$(mktemp "$RUNNER_TEMP/review-sensei-pr.XXXXXX")"
          trap 'rm -f "$payload"' EXIT
          umask 077
          if ! gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" > "$payload"; then
            echo '::error::authoritative GitHub pull-request preflight was unavailable; refusing provider execution' >&2
            exit 1
          fi
          python - "$payload" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          path = sys.argv[1]
          flags = os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0)
          try:
              descriptor = os.open(path, flags)
          except OSError as error:
              raise SystemExit(f"pull request metadata cannot be opened safely: {error}")
          with os.fdopen(descriptor, "rb") as stream:
              raw = stream.read(512 * 1024 + 1)
          if len(raw) > 512 * 1024:
              raise SystemExit("pull request metadata exceeds the configured response limit")
          try:
              data = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"pull request metadata is not valid JSON: {error}")
          if not isinstance(data, dict) or data.get("state") != "open" or data.get("draft") is True:
              raise SystemExit("pull request is not eligible for review")
          requested_number = os.environ.get("PULL_REQUEST", "")
          if (
              isinstance(data.get("number"), bool)
              or not isinstance(data.get("number"), int)
              or data.get("number") != int(requested_number)
          ):
              raise SystemExit("pull request number identity does not match")
          head = data.get("head")
          base = data.get("base")
          head_repo = head.get("repo") if isinstance(head, dict) else None
          base_repo = base.get("repo") if isinstance(base, dict) else None
          if not isinstance(head_repo, dict) or not isinstance(base_repo, dict):
              raise SystemExit("pull request identity metadata is unavailable")
          repository = os.environ.get("REPOSITORY", "")
          repository_id = os.environ.get("REPOSITORY_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*", repository_id):
              raise SystemExit("repository id must be a positive decimal integer")
          if base_repo.get("full_name") != repository or base_repo.get("id") != int(repository_id):
              raise SystemExit("pull request repository identity does not match")
          if head_repo.get("full_name") != repository or head_repo.get("fork") is not False:
              raise SystemExit("pull request head repository is not eligible")
          if head.get("sha") != os.environ.get("HEAD_SHA", ""):
              raise SystemExit("pull request head is stale")
          if base.get("ref") != os.environ.get("BASE_REF", ""):
              raise SystemExit("pull request base branch is stale")
          supplied_base = os.environ.get("BASE_SHA", "")
          if supplied_base and base.get("sha") != supplied_base:
              raise SystemExit("pull request base is stale")
          supplied_head_repo = os.environ.get("HEAD_REPOSITORY", "")
          if supplied_head_repo and supplied_head_repo != head_repo.get("full_name"):
              raise SystemExit("pull request head repository does not match")
          if not re.fullmatch(r"[a-f0-9]{40}", str(head.get("sha", ""))):
              raise SystemExit("pull request head identity is invalid")
          if not re.fullmatch(r"[a-f0-9]{40}", str(base.get("sha", ""))):
              raise SystemExit("pull request base identity is invalid")
          title = data.get("title", "")
          if not isinstance(title, str) or len(title.encode("utf-8")) > 256:
              raise SystemExit("pull request title exceeds the 256-byte limit")
          encoded = base64.b64encode(title.encode("utf-8")).decode("ascii")
          if len(encoded) > 8192:
              raise SystemExit("encoded pull request title exceeds the workflow output limit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pull_request_title_b64={encoded}\n")
              output.write(f"base_sha={base['sha']}\n")
              output.write(f"pull_request_number={data['number']}\n")
          PY

  command:
    needs: [bootstrap, authoritative-preflight]
    # authoritative-preflight re-reads the live PR and rejects a head SHA that
    # no longer matches, so the mutation only runs against the commit the
    # maintainer addressed. Maintainer status/pause/resume/verify/disposition
    # commands have their own authorization and do not depend on
    # conversational replies being enabled.
    if: inputs.operation == 'command' && needs.bootstrap.outputs.writes == 'true'
    concurrency:
      group: reviewsensei-command-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The session-comment mutation is authorized by the OIDC broker's
    # `review_session` capability (pull_requests: write); GITHUB_TOKEN keeps no
    # write scope, matching ADR 0022/0050.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ needs.bootstrap.outputs.package_version }}
          REVIEW_SENSEI_WORKFLOW_COMMIT: ${{ needs.bootstrap.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The ReviewSensei release identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei workflow commit is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_COMMIT."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_COMMIT"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_COMMIT"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Apply broker-attested maintainer command
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_ACTOR: ${{ inputs.comment_actor }}
          COMMENT_ACTOR_TYPE: ${{ inputs.comment_actor_type }}
          COMMENT_ASSOCIATION: ${{ inputs.comment_association }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.reviewsensei.dev")"
          oidc_token="$(printf '%s' "$oidc_response" | "$RUNNER_TEMP/review-sensei-venv/bin/python" -c 'import json, sys; value = json.load(sys.stdin).get("value"); assert isinstance(value, str) and value; print(value)')"
          attestation="$RUNNER_TEMP/review-sensei-command-attestation.json"
          "$RUNNER_TEMP/review-sensei-venv/bin/python" - "$attestation" <<'PY'
          import json
          import os
          import re
          import sys
          import time

          repository = os.environ.get("REPOSITORY", "")
          repository_id = os.environ.get("REPOSITORY_ID", "")
          pull_request = os.environ.get("PULL_REQUEST", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          source_comment_id = os.environ.get("SOURCE_COMMENT_ID", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          workflow_ref = os.environ.get("JOB_WORKFLOW_REF", "")
          workflow_sha = os.environ.get("JOB_WORKFLOW_SHA", "")
          if not re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", repository) or not re.fullmatch(r"[1-9][0-9]*", repository_id) or not re.fullmatch(r"[1-9][0-9]*", pull_request) or not re.fullmatch(r"[a-f0-9]{40}", head_sha) or not re.fullmatch(r"[1-9][0-9]*", source_comment_id) or not re.fullmatch(r"[1-9][0-9]{0,18}", run_id) or not re.fullmatch(r"[a-f0-9]{40}", workflow_sha):
              raise SystemExit("hosted command identity is invalid")
          json.dump({
              "version": 1,
              "repository": repository,
              "repository_id": int(repository_id),
              "pull_request": int(pull_request),
              "head_sha": head_sha,
              "operation": "command",
              "source_comment_id": int(source_comment_id),
              "run_id": run_id,
              "issued_at": int(time.time()),
              "concurrency_group": f"reviewsensei-session-{repository_id}-{pull_request}",
              "job_workflow_ref": workflow_ref,
              "job_workflow_sha": workflow_sha,
          }, open(sys.argv[1], "w", encoding="utf-8"), separators=(",", ":"))
          PY
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github command \
            --comment-body "$COMMENT_BODY" --actor "$COMMENT_ACTOR" \
            --actor-type "$COMMENT_ACTOR_TYPE" --association "$COMMENT_ASSOCIATION" \
            --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST" --head-sha "$HEAD_SHA" \
            --source-comment-id "$SOURCE_COMMENT_ID" --session-attestation "$attestation" \
            --github-session-ledger --oidc-token "$oidc_token" --allow-write

  hosted:
    needs: [bootstrap, authoritative-preflight]
    # The plan decides the backend and its runner requirement; this job is the
    # hosted half of that decision. Both the review and reply paths mutate
    # through the broker, so github.writes is a precondition. github.reviews
    # and github.learning travel to the package as explicit invocation flags
    # below and are never re-derived here.
    if: >-
      needs.bootstrap.outputs.runner_kind == 'hosted' &&
      needs.bootstrap.outputs.writes == 'true' &&
      ((inputs.operation == 'review' && (inputs.mode == 'manual' || needs.bootstrap.outputs.automatic_reviews == 'true')) ||
      (inputs.operation == 'reply' && needs.bootstrap.outputs.mentions == 'true'))
    concurrency:
      # The hosted and local jobs share this review group, so a newer review
      # cancels an older one for the same PR regardless of where it runs. Reply
      # operations intentionally use the triggering run id and never cancel a
      # sibling reply. The preflight output is authoritative for manual
      # reviews; event PR metadata is only a host-provided fallback.
      group: reviewsensei-provider-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (needs.authoritative-preflight.outputs.pull_request_number || github.event.pull_request.number || github.run_id) || github.run_id }}
      cancel-in-progress: ${{ inputs.operation == 'review' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out the trusted policy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workspace is the frozen policy commit, so the package resolves
          # its configuration, stages, and categories from trusted content and
          # never from the pull-request head.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check out the trusted reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authoritative-preflight.outputs.base_sha || inputs.base_sha || inputs.base_ref }}
          path: trusted-base
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git -C trusted-base rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          RUNNER_KIND: ${{ needs.bootstrap.outputs.runner_kind }}
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          backend_pattern = re.compile(
              r"^(local-ollama|cloud-ollama|openrouter|openai-compatible)$"
          )
          credential_pattern = re.compile(r"^(|[A-Z][A-Z0-9_]*)$")

          def valid_ref(value: str) -> bool:
              return bool(
                  value
                  and not value.startswith("-")
                  and "--" not in value
                  and not value.endswith("-")
                  and ref_pattern.fullmatch(value)
              )

          if os.environ.get("MODE") not in {"automatic", "manual"}:
              raise SystemExit("workflow mode is invalid")
          if os.environ.get("OPERATION") not in {"review", "reply"}:
              raise SystemExit("workflow operation is invalid")
          # Each provider job re-checks the plan output it was selected by, so
          # a plan/job mismatch fails closed instead of running a backend on
          # the wrong runner.
          if os.environ.get("RUNNER_KIND") != "hosted":
              raise SystemExit("hosted job received a non-hosted plan")
          if not backend_pattern.fullmatch(os.environ.get("BACKEND", "")):
              raise SystemExit("plan backend is invalid")
          model = os.environ.get("MODEL", "")
          if not model or model.startswith("-"):
              raise SystemExit("plan model is invalid")
          if not re.fullmatch(r"https?://[^\s]+", os.environ.get("BASE_URL", "")):
              raise SystemExit("plan endpoint is invalid")
          if not credential_pattern.fullmatch(os.environ.get("CREDENTIAL_ENV", "")):
              raise SystemExit("plan credential reference is invalid")
          if os.environ.get("CREDENTIAL_REQUIRED") not in {"true", "false"}:
              raise SystemExit("plan credential requirement is invalid")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          base_ref = os.environ.get("BASE_REF", "")
          if not valid_ref(base_ref):
              raise SystemExit("BASE_REF input is invalid")
          head_ref = os.environ.get("HEAD_REF", "")
          if os.environ.get("OPERATION") == "review" and not valid_ref(head_ref):
              raise SystemExit("HEAD_REF input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if os.environ.get("OPERATION") == "review" and not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ needs.bootstrap.outputs.package_version }}
          REVIEW_SENSEI_WORKFLOW_COMMIT: ${{ needs.bootstrap.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The ReviewSensei release identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei workflow commit is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check --upgrade pip 2>&1 | tee "$pypi_log" && \
            "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee -a "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_COMMIT."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_COMMIT"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_COMMIT"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Scope the selected backend credential
        id: credential
        env:
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Exactly one credential reference is materialized, and only when the
          # plan says the selected backend requires it. A backend that requires
          # no credential never receives one implicitly, and a credential's
          # presence never authorizes writes or inference.
          case "$CREDENTIAL_ENV" in
            "")
              if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
                echo '::error::the selected backend requires a credential but the plan named none' >&2
                exit 1
              fi
              echo "no credential is required for backend ${{ needs.bootstrap.outputs.backend }}"
              exit 0
              ;;
            OLLAMA_API_KEY|OPENROUTER_API_KEY|OPENAI_API_KEY)
              ;;
            *)
              echo "::error::credential reference $CREDENTIAL_ENV is not one of this workflow's declared secrets (OLLAMA_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY); declare it in .reviewsensei.yml advanced.endpoint.credential_env or run the analysis locally" >&2
              exit 1
              ;;
          esac
          if [[ "$CREDENTIAL_REQUIRED" != "true" ]]; then
            echo "backend ${{ needs.bootstrap.outputs.backend }} does not require a credential; none is materialized"
            exit 0
          fi
          credential_value="${!CREDENTIAL_ENV:-}"
          if [[ -z "$credential_value" ]]; then
            echo "::error::secret $CREDENTIAL_ENV is required for the selected backend and is not available to this workflow" >&2
            exit 1
          fi
          echo "::add-mask::$credential_value"
          printf '%s=%s\n' "$CREDENTIAL_ENV" "$credential_value" >> "$GITHUB_ENV"
          echo "materialized secret $CREDENTIAL_ENV for the selected backend"

      - name: Prepare bounded trusted-base diff
        if: inputs.operation == 'review'
        env:
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then
            args+=(--head-repository "$HEAD_REPOSITORY")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD/trusted-base" --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000

      - name: Run hosted review
        id: provider-review
        if: inputs.operation == 'review'
        env:
          RUNNER_KIND: ${{ needs.bootstrap.outputs.runner_kind }}
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          LEARNING: ${{ needs.bootstrap.outputs.learning }}
          ARTIFACTS: ${{ needs.bootstrap.outputs.artifacts }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          TITLE_B64: ${{ needs.authoritative-preflight.outputs.pull_request_title_b64 }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
        run: |
          # The runner the plan selected is verified before inference: a
          # backend-aware plan that lands on the wrong runner fails here rather
          # than reaching an unintended provider or endpoint.
          [[ "$RUNNER_KIND" == "hosted" ]] || { echo '::error::hosted review requires the hosted runner plan' >&2; exit 1; }
          if [[ -n "$TITLE_B64" && ( ${#TITLE_B64} -gt 8192 || ! "$TITLE_B64" =~ ^[A-Za-z0-9+/=]+$ ) ]]; then
            echo '::error::authoritative pull-request title output is invalid' >&2
            exit 1
          fi
          TITLE=""
          if [[ -n "$TITLE_B64" ]] && ! TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode)"; then
            echo '::error::authoritative pull-request title output could not be decoded' >&2
            exit 1
          fi
          review_args=(--diff pr.patch --repository "$REPOSITORY" --pull-request "$PULL_REQUEST")
          if [[ -n "$TITLE" ]]; then review_args+=(--title "$TITLE"); fi
          if [[ "$LEARNING" == "disabled" ]]; then review_args+=(--no-learning-proposals); fi
          if [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--head-sha "$HEAD_SHA"); fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--base-sha "$BASE_SHA"); fi
          if [[ "$ARTIFACTS" == "diagnostics" ]]; then
            review_args+=(--recovery-artifact recovery-artifact.json)
          fi
          # Reserve the round, checkpoint the identity-bound transaction, and
          # emit the trusted admission artifacts before inference results are
          # published. The transaction lives in the broker-attested comment
          # ledger rather than a runner-local file, so the publication step of
          # this run and the analysis of the next run read the same durable
          # rounds and baselines.
          review_args+=(--transaction --github-session-ledger \
            --repository-id "$REPOSITORY_ID" \
            --configuration-context-output configuration-context.json \
            --admission-context-output admission-context.json)
          # Backend, endpoint, and model are plan outputs. The workflow holds
          # no provider default and no model chain.
          review_args+=(--provider "$BACKEND" --base-url "$BASE_URL" --model "$MODEL")
          review_args+=(--format json --exit-semantics operational)
          # The named credential travels only when the selected backend
          # requires one. A backend that requires no credential receives none
          # implicitly: a cloud key exported for another backend must not reach
          # a local endpoint.
          if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
            review_args+=(--api-key-env "$CREDENTIAL_ENV")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" "${review_args[@]}" \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --output review.json --outcome outcome.json

      # success() && !cancelled() skips a pointless API call after a failed
      # provider step or cancelled run. Publish still has its own cancellation
      # guard and requires status=current from this head check.
      - name: Confirm live pull-request head is still current
        id: publish-admission
        if: success() && !cancelled() && inputs.operation == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          live_sha=""
          for attempt in 1 2 3; do
            err_file="$RUNNER_TEMP/rs-head-revalidate.$$"
            if live_sha="$(gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha' 2>"$err_file")"; then
              rm -f "$err_file"
              break
            fi
            err_text="$(tr -d '\000' <"$err_file" | tail -n 20)"
            rm -f "$err_file"
            if [[ "$err_text" =~ HTTP\ (401|403|404) ]]; then
              echo '::error::live pull-request head revalidation was unauthorized or missing; refusing publish' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::live pull-request head revalidation was unavailable; refusing publish' >&2
              exit 1
            fi
            delay=$((1 << (attempt - 1)))
            if [[ "$err_text" =~ HTTP\ 429 ]]; then
              delay=$((delay * 2))
            fi
            if [[ "$delay" -gt 8 ]]; then
              delay=8
            fi
            jitter_hundredths=$((RANDOM % 50))
            sleep "${delay}.${jitter_hundredths}"
          done
          if [[ ! "$live_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::live pull-request head identity is invalid; refusing publish' >&2
            exit 1
          fi
          if [[ "$live_sha" != "$HEAD_SHA" ]]; then
            echo '::error::publish skipped_stale: reviewed head is no longer the live pull-request head' >&2
            echo 'skipped_stale'
            echo 'status=skipped_stale' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish admission current'
          echo 'status=current' >> "$GITHUB_OUTPUT"

      - name: Publish or promote validated review through the broker
        if: success() && !cancelled() && inputs.operation == 'review' && steps.publish-admission.outputs.status == 'current'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          REVIEWS: ${{ needs.bootstrap.outputs.reviews }}
          LEARNING: ${{ needs.bootstrap.outputs.learning }}
        run: |
          publish_args=(--enable-review)
          if [[ "$REVIEWS" == "auto-approve" ]]; then
            publish_args+=(--enable-auto-approve)
          else
            publish_args+=(--no-auto-approve)
          fi
          if [[ "$LEARNING" == "pull-requests" ]]; then
            publish_args+=(--enable-learning-prs)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --outcome publication-outcome.json --github-session-ledger \
            --configuration-context configuration-context.json \
            --admission-context admission-context.json \
            --allow-write "${publish_args[@]}"

      - name: Generate and publish hosted mention reply
        id: reply
        if: inputs.operation == 'reply'
        env:
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          REVIEWS: ${{ needs.bootstrap.outputs.reviews }}
        run: |
          reply_output="$RUNNER_TEMP/review-sensei-reply-status"
          auto_approve_args=()
          if [[ "$REVIEWS" == "auto-approve" ]]; then
            auto_approve_args+=(--enable-auto-approve)
          else
            auto_approve_args+=(--no-auto-approve)
          fi
          reply_args=(--generate --provider "$BACKEND" --base-url "$BASE_URL" \
            --model "$MODEL" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply "${auto_approve_args[@]}")
          if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
            reply_args+=(--api-key-env "$CREDENTIAL_ENV")
          fi
          set +e
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            "${reply_args[@]}" > "$reply_output"
          reply_exit=$?
          set -e
          reply_status="$(grep -E '^(replied_and_resolved|already_replied_and_resolved|replied|already_replied|skipped_source_gone|skipped_no_mention|skipped_unauthorized|skipped_edited_source|skipped_pr_state|skipped_stale_head|skipped_fork)$' "$reply_output" | tail -n 1 || true)"
          echo "$reply_status"
          if [[ "$reply_exit" -ne 0 ]]; then
            echo "::error::mention reply command failed (exit $reply_exit)" >&2
            exit 1
          fi
          case "$reply_status" in
            replied_and_resolved|already_replied_and_resolved)
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              ;;
            replied|already_replied|skipped_source_gone|skipped_no_mention|\
              skipped_unauthorized|skipped_edited_source|skipped_pr_state|\
              skipped_stale_head|skipped_fork)
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected mention reply status: $reply_status" >&2
              exit 1
              ;;
          esac

      - name: Verify mention reply completed
        if: >-
          always() && inputs.operation == 'reply' &&
          steps.reply.outcome != 'success'
        run: |
          echo '::error::mention reply step did not complete successfully' >&2
          exit 1

      - name: Upload diagnostics artifact
        if: inputs.operation == 'review' && needs.bootstrap.outputs.artifacts == 'diagnostics' && steps.provider-review.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-diagnostics
          path: |
            review.json
            outcome.json
            recovery-artifact.json
          if-no-files-found: error
          retention-days: 7

  local:
    needs: [bootstrap, authoritative-preflight]
    # Backend-aware runner planning: the same plan that selected the backend
    # selects this job when the backend declares a local runner.
    if: >-
      needs.bootstrap.outputs.runner_kind == 'local' &&
      needs.bootstrap.outputs.writes == 'true' &&
      ((inputs.operation == 'review' && (inputs.mode == 'manual' || needs.bootstrap.outputs.automatic_reviews == 'true')) ||
      (inputs.operation == 'reply' && needs.bootstrap.outputs.mentions == 'true'))
    concurrency:
      # Keep this key byte-for-byte equivalent to the hosted job. A newer
      # review therefore cancels any older review for the same PR regardless
      # of where it runs, while each mention reply remains isolated to its
      # triggering run.
      group: reviewsensei-provider-${{ inputs.operation == 'review' && 'review' || 'reply' }}-${{ github.repository }}-${{ inputs.operation == 'review' && (needs.authoritative-preflight.outputs.pull_request_number || github.event.pull_request.number || github.run_id) || github.run_id }}
      cancel-in-progress: ${{ inputs.operation == 'review' }}
    runs-on: [self-hosted, linux, x64, ollama]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check out the trusted policy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check out the trusted reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authoritative-preflight.outputs.base_sha || inputs.base_sha || inputs.base_ref }}
          path: trusted-base
          fetch-depth: 0

      - name: Resolve trusted base SHA
        id: trusted-base
        run: echo "sha=$(git -C trusted-base rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate trusted workflow inputs
        env:
          MODE: ${{ inputs.mode }}
          OPERATION: ${{ inputs.operation }}
          RUNNER_KIND: ${{ needs.bootstrap.outputs.runner_kind }}
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import re

          ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          repository_pattern = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          backend_pattern = re.compile(
              r"^(local-ollama|cloud-ollama|openrouter|openai-compatible)$"
          )
          credential_pattern = re.compile(r"^(|[A-Z][A-Z0-9_]*)$")

          def valid_ref(value: str) -> bool:
              return bool(
                  value
                  and not value.startswith("-")
                  and "--" not in value
                  and not value.endswith("-")
                  and ref_pattern.fullmatch(value)
              )

          if os.environ.get("MODE") not in {"automatic", "manual"}:
              raise SystemExit("workflow mode is invalid")
          if os.environ.get("OPERATION") not in {"review", "reply"}:
              raise SystemExit("workflow operation is invalid")
          # Each provider job re-checks the plan output it was selected by, so
          # a plan/job mismatch fails closed instead of running a backend on
          # the wrong runner.
          if os.environ.get("RUNNER_KIND") != "local":
              raise SystemExit("local job received a non-local plan")
          if not backend_pattern.fullmatch(os.environ.get("BACKEND", "")):
              raise SystemExit("plan backend is invalid")
          model = os.environ.get("MODEL", "")
          if not model or model.startswith("-"):
              raise SystemExit("plan model is invalid")
          if not re.fullmatch(r"https?://[^\s]+", os.environ.get("BASE_URL", "")):
              raise SystemExit("plan endpoint is invalid")
          if not credential_pattern.fullmatch(os.environ.get("CREDENTIAL_ENV", "")):
              raise SystemExit("plan credential reference is invalid")
          if os.environ.get("CREDENTIAL_REQUIRED") not in {"true", "false"}:
              raise SystemExit("plan credential requirement is invalid")
          if not repository_pattern.fullmatch(os.environ.get("REPOSITORY", "")):
              raise SystemExit("repository input is invalid")
          base_ref = os.environ.get("BASE_REF", "")
          if not valid_ref(base_ref):
              raise SystemExit("BASE_REF input is invalid")
          head_ref = os.environ.get("HEAD_REF", "")
          if os.environ.get("OPERATION") == "review" and not valid_ref(head_ref):
              raise SystemExit("HEAD_REF input is invalid")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.fullmatch(r"[a-f0-9]{40}", base_sha):
              raise SystemExit("BASE_SHA input is invalid")
          head_sha = os.environ.get("HEAD_SHA", "")
          if os.environ.get("OPERATION") == "review" and not re.fullmatch(r"[a-f0-9]{40}", head_sha):
              raise SystemExit("HEAD_SHA input is invalid")
          head_repository = os.environ.get("HEAD_REPOSITORY", "")
          if head_repository and not repository_pattern.fullmatch(head_repository):
              raise SystemExit("head repository input is invalid")
          PY

      - name: Install ReviewSensei package (PyPI first, GitHub fallback)
        env:
          REVIEW_SENSEI_VERSION: ${{ needs.bootstrap.outputs.package_version }}
          REVIEW_SENSEI_WORKFLOW_COMMIT: ${{ needs.bootstrap.outputs.workflow_commit }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/review-sensei-venv"
          python_bin="$RUNNER_TEMP/review-sensei-venv/bin/python"
          expected_version="${REVIEW_SENSEI_VERSION#v}"
          pypi_log="$RUNNER_TEMP/review-sensei-pypi-install.log"
          if [[ ! "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The ReviewSensei release identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$REVIEW_SENSEI_WORKFLOW_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The ReviewSensei workflow commit is invalid." >&2
            exit 1
          fi
          if "$python_bin" -m pip install --disable-pip-version-check "review-sensei==$expected_version" 2>&1 | tee "$pypi_log"; then
            install_source="PyPI"
          elif grep -Fq "No matching distribution found for review-sensei==" "$pypi_log" || \
            grep -Fq "Could not find a version that satisfies the requirement review-sensei==" "$pypi_log"; then
            echo "::warning::review-sensei==$expected_version is unavailable on PyPI; installing the verified ReviewSensei workflow commit $REVIEW_SENSEI_WORKFLOW_COMMIT."
            "$python_bin" -m pip install --disable-pip-version-check \
              "git+https://github.com/malsabbagh/review-sensei.git@$REVIEW_SENSEI_WORKFLOW_COMMIT"
            install_source="GitHub@$REVIEW_SENSEI_WORKFLOW_COMMIT"
          else
            echo "::error::PyPI installation failed for review-sensei==$expected_version for a reason other than an unavailable distribution; refusing the GitHub fallback." >&2
            exit 1
          fi
          installed_version="$("$python_bin" -c 'import importlib.metadata; print(importlib.metadata.version("review-sensei"))')"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "::error::ReviewSensei version mismatch: expected $expected_version, installed $installed_version." >&2
            exit 1
          fi
          "$python_bin" -m pip check
          echo "Installed ReviewSensei $installed_version from $install_source."

      - name: Scope the selected backend credential
        id: credential
        env:
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Exactly one credential reference is materialized, and only when the
          # plan says the selected backend requires it. A backend that requires
          # no credential never receives one implicitly, and a credential's
          # presence never authorizes writes or inference.
          case "$CREDENTIAL_ENV" in
            "")
              if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
                echo '::error::the selected backend requires a credential but the plan named none' >&2
                exit 1
              fi
              echo "no credential is required for backend ${{ needs.bootstrap.outputs.backend }}"
              exit 0
              ;;
            OLLAMA_API_KEY|OPENROUTER_API_KEY|OPENAI_API_KEY)
              ;;
            *)
              echo "::error::credential reference $CREDENTIAL_ENV is not one of this workflow's declared secrets (OLLAMA_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY); declare it in .reviewsensei.yml advanced.endpoint.credential_env or run the analysis locally" >&2
              exit 1
              ;;
          esac
          if [[ "$CREDENTIAL_REQUIRED" != "true" ]]; then
            echo "backend ${{ needs.bootstrap.outputs.backend }} does not require a credential; none is materialized"
            exit 0
          fi
          credential_value="${!CREDENTIAL_ENV:-}"
          if [[ -z "$credential_value" ]]; then
            echo "::error::secret $CREDENTIAL_ENV is required for the selected backend and is not available to this workflow" >&2
            exit 1
          fi
          echo "::add-mask::$credential_value"
          printf '%s=%s\n' "$CREDENTIAL_ENV" "$credential_value" >> "$GITHUB_ENV"
          echo "materialized secret $CREDENTIAL_ENV for the selected backend"

      - name: Run local review
        id: provider-review
        if: inputs.operation == 'review'
        env:
          RUNNER_KIND: ${{ needs.bootstrap.outputs.runner_kind }}
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          CREDENTIAL_ENV: ${{ needs.bootstrap.outputs.credential_env }}
          CREDENTIAL_REQUIRED: ${{ needs.bootstrap.outputs.credential_required }}
          LEARNING: ${{ needs.bootstrap.outputs.learning }}
          ARTIFACTS: ${{ needs.bootstrap.outputs.artifacts }}
          BASE_REF: ${{ steps.trusted-base.outputs.sha }}
          HEAD_REF: ${{ inputs.head_sha }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          TITLE_B64: ${{ needs.authoritative-preflight.outputs.pull_request_title_b64 }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
        run: |
          [[ "$RUNNER_KIND" == "local" ]] || { echo '::error::local review requires the local runner plan' >&2; exit 1; }
          # The local prerequisite is verified against the planned endpoint and
          # model: an unreachable server or a missing model fails before
          # inference instead of failing mid-review.
          curl --fail --silent --show-error --max-time 10 "$BASE_URL/tags" >/dev/null
          ollama show "$MODEL" >/dev/null
          args=()
          if [[ -n "$HEAD_REPOSITORY" ]]; then args+=(--head-repository "$HEAD_REPOSITORY"); fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" prepare-diff \
            --repository "$PWD/trusted-base" --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            "${args[@]}" --output pr.patch --max-diff-bytes 1048576 \
            --max-diff-lines 50000 --max-diff-files 500 --max-diff-hunks 5000
          if [[ -n "$TITLE_B64" && ( ${#TITLE_B64} -gt 8192 || ! "$TITLE_B64" =~ ^[A-Za-z0-9+/=]+$ ) ]]; then
            echo '::error::authoritative pull-request title output is invalid' >&2
            exit 1
          fi
          TITLE=""
          if [[ -n "$TITLE_B64" ]] && ! TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode)"; then
            echo '::error::authoritative pull-request title output could not be decoded' >&2
            exit 1
          fi
          review_args=(--diff pr.patch --repository "$REPOSITORY" --pull-request "$PULL_REQUEST")
          if [[ -n "$TITLE" ]]; then review_args+=(--title "$TITLE"); fi
          if [[ "$LEARNING" == "disabled" ]]; then review_args+=(--no-learning-proposals); fi
          if [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--head-sha "$HEAD_SHA"); fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then review_args+=(--base-sha "$BASE_SHA"); fi
          if [[ "$ARTIFACTS" == "diagnostics" ]]; then
            review_args+=(--recovery-artifact recovery-artifact.json)
          fi
          # Reserve the round, checkpoint the identity-bound transaction, and
          # emit the trusted admission artifacts before inference results are
          # published. The transaction lives in the broker-attested comment
          # ledger rather than a runner-local file, so the publication step of
          # this run and the analysis of the next run read the same durable
          # rounds and baselines.
          review_args+=(--transaction --github-session-ledger \
            --repository-id "$REPOSITORY_ID" \
            --configuration-context-output configuration-context.json \
            --admission-context-output admission-context.json)
          review_args+=(--provider "$BACKEND" --base-url "$BASE_URL" --model "$MODEL")
          review_args+=(--format json --exit-semantics operational)
          if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
            review_args+=(--api-key-env "$CREDENTIAL_ENV")
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" "${review_args[@]}" \
            --learning-root . --learning-directory .github/review-sensei/learnings \
            --output review.json --outcome outcome.json

      # success() && !cancelled() skips a pointless API call after a failed
      # provider step or cancelled run. Publish still has its own cancellation
      # guard and requires status=current from this head check.
      - name: Confirm live pull-request head is still current
        id: publish-admission
        if: success() && !cancelled() && inputs.operation == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pull request identity is invalid' >&2; exit 1; }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo '::error::repository identity is invalid' >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::head sha identity is invalid' >&2; exit 1; }
          live_sha=""
          for attempt in 1 2 3; do
            err_file="$RUNNER_TEMP/rs-head-revalidate.$$"
            if live_sha="$(gh api --method GET "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha' 2>"$err_file")"; then
              rm -f "$err_file"
              break
            fi
            err_text="$(tr -d '\000' <"$err_file" | tail -n 20)"
            rm -f "$err_file"
            if [[ "$err_text" =~ HTTP\ (401|403|404) ]]; then
              echo '::error::live pull-request head revalidation was unauthorized or missing; refusing publish' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::live pull-request head revalidation was unavailable; refusing publish' >&2
              exit 1
            fi
            delay=$((1 << (attempt - 1)))
            if [[ "$err_text" =~ HTTP\ 429 ]]; then
              delay=$((delay * 2))
            fi
            if [[ "$delay" -gt 8 ]]; then
              delay=8
            fi
            jitter_hundredths=$((RANDOM % 50))
            sleep "${delay}.${jitter_hundredths}"
          done
          if [[ ! "$live_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::live pull-request head identity is invalid; refusing publish' >&2
            exit 1
          fi
          if [[ "$live_sha" != "$HEAD_SHA" ]]; then
            echo '::error::publish skipped_stale: reviewed head is no longer the live pull-request head' >&2
            echo 'skipped_stale'
            echo 'status=skipped_stale' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish admission current'
          echo 'status=current' >> "$GITHUB_OUTPUT"

      - name: Publish or promote validated local review and learnings
        if: success() && !cancelled() && inputs.operation == 'review' && steps.publish-admission.outputs.status == 'current'
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha || steps.trusted-base.outputs.sha }}
          REVIEWS: ${{ needs.bootstrap.outputs.reviews }}
          LEARNING: ${{ needs.bootstrap.outputs.learning }}
        run: |
          publish_args=(--enable-review)
          if [[ "$REVIEWS" == "auto-approve" ]]; then
            publish_args+=(--enable-auto-approve)
          else
            publish_args+=(--no-auto-approve)
          fi
          if [[ "$LEARNING" == "pull-requests" ]]; then
            publish_args+=(--enable-learning-prs)
          fi
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github review \
            --result review.json --diff pr.patch --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" --pull-request "$PULL_REQUEST" \
            --head-sha "$HEAD_SHA" --base-branch "$BASE_REF" --base-sha "$BASE_SHA" \
            --outcome publication-outcome.json --github-session-ledger \
            --configuration-context configuration-context.json \
            --admission-context admission-context.json \
            --allow-write "${publish_args[@]}"

      - name: Generate and publish local mention reply
        id: reply
        if: inputs.operation == 'reply'
        env:
          BACKEND: ${{ needs.bootstrap.outputs.backend }}
          BASE_URL: ${{ needs.bootstrap.outputs.base_url }}
          MODEL: ${{ needs.bootstrap.outputs.model }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request_number || github.event.pull_request.number || github.event.issue.number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_UPDATED_AT: ${{ inputs.source_updated_at }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ROOT_COMMENT_ID: ${{ inputs.root_comment_id }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          REVIEWS: ${{ needs.bootstrap.outputs.reviews }}
        run: |
          # The same local prerequisite check the review path uses, so a reply
          # never reaches an unreachable server or a missing model.
          curl --fail --silent --show-error --max-time 10 "$BASE_URL/tags" >/dev/null
          ollama show "$MODEL" >/dev/null
          reply_output="$RUNNER_TEMP/review-sensei-reply-status"
          auto_approve_args=()
          if [[ "$REVIEWS" == "auto-approve" ]]; then
            auto_approve_args+=(--enable-auto-approve)
          else
            auto_approve_args+=(--no-auto-approve)
          fi
          reply_args=(--generate --provider "$BACKEND" --base-url "$BASE_URL" \
            --model "$MODEL" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --source-comment-id "$SOURCE_COMMENT_ID" \
            --source-updated-at "$SOURCE_UPDATED_AT" --head-sha "$HEAD_SHA" \
            --root-comment-id "$ROOT_COMMENT_ID" --source-kind "$SOURCE_KIND" \
            --allow-write --enable-reply "${auto_approve_args[@]}")
          if [[ "$CREDENTIAL_REQUIRED" == "true" ]]; then
            reply_args+=(--api-key-env "$CREDENTIAL_ENV")
          fi
          set +e
          "$RUNNER_TEMP/review-sensei-venv/bin/review-sensei" github reply \
            "${reply_args[@]}" > "$reply_output"
          reply_exit=$?
          set -e
          reply_status="$(grep -E '^(replied_and_resolved|already_replied_and_resolved|replied|already_replied|skipped_source_gone|skipped_no_mention|skipped_unauthorized|skipped_edited_source|skipped_pr_state|skipped_stale_head|skipped_fork)$' "$reply_output" | tail -n 1 || true)"
          echo "$reply_status"
          if [[ "$reply_exit" -ne 0 ]]; then
            echo "::error::mention reply command failed (exit $reply_exit)" >&2
            exit 1
          fi
          case "$reply_status" in
            replied_and_resolved|already_replied_and_resolved)
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              ;;
            replied|already_replied|skipped_source_gone|skipped_no_mention|\
              skipped_unauthorized|skipped_edited_source|skipped_pr_state|\
              skipped_stale_head|skipped_fork)
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected mention reply status: $reply_status" >&2
              exit 1
              ;;
          esac

      - name: Verify mention reply completed
        if: >-
          always() && inputs.operation == 'reply' &&
          steps.reply.outcome != 'success'
        run: |
          echo '::error::mention reply step did not complete successfully' >&2
          exit 1

      - name: Upload diagnostics artifact
        if: inputs.operation == 'review' && needs.bootstrap.outputs.artifacts == 'diagnostics' && steps.provider-review.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-sensei-diagnostics
          path: |
            review.json
            outcome.json
            recovery-artifact.json
          if-no-files-found: error
          retention-days: 7

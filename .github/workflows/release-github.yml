name: Release review-sensei-github

on:
  push:
    tags:
      - "github-v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish review-sensei-github to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-github
      url: https://pypi.org/p/review-sensei-github
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check tag and version consistency
        run: python scripts/check_release_version.py --package github --tag "$GITHUB_REF_NAME"

      - name: Build the hosted distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist packages/python/review-sensei-github

      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          verify-metadata: true
          skip-existing: false
          attestations: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR heads need no more compute; reviewed main runs still finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compatibility:
    name: Compatibility (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install package and CI tools
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip install -e .
          python -m pip install -e packages/python/review-sensei-github --no-deps
      - name: Compile sources
        run: python -m compileall -q src
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run every Windows test in isolated processes
        if: runner.os == 'Windows'
        run: python scripts/run_checkout_tests.py --workers 4 --costs tests/fixtures/checkout-class-seconds.json --report "${{ runner.temp }}/checkout-timings.json"

      - name: Retain checkout inventory and worker timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checkout-timings-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/checkout-timings.json
          if-no-files-found: warn

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install package and CI tools
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install -e .
          python -m pip install -e packages/python/review-sensei-github --no-deps
      - name: Preserve registered quarantine creation slots
        env:
          REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_quarantine_registry.py --base-revision "$REGISTRY_BASE"
      - name: Format check
        run: python -m ruff format --check setup.py src tests scripts packages/python/review-sensei-github
      - name: Lint check
        run: python -m ruff check setup.py src tests scripts packages/python/review-sensei-github
      - name: Type check
        run: python -m mypy src packages/python/review-sensei-github/src
      - name: Compile sources
        run: python -m compileall -q src
      - name: Branch coverage
        run: |
          python scripts/run_checkout_tests.py --workers 4 --coverage --costs tests/fixtures/checkout-class-seconds.json --report "$RUNNER_TEMP/checkout-timings.json"
          python -m coverage report --precision=2 --show-missing --fail-under=80

      - name: Retain checkout inventory and worker timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checkout-timings-quality
          path: ${{ runner.temp }}/checkout-timings.json
          if-no-files-found: warn

  schemas:
    name: Schemas and Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install package and CI tools
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip install -e .
          python -m pip install -e packages/python/review-sensei-github --no-deps
      - name: Check immutable Action pins
        run: python scripts/check_action_pins.py
      - name: Validate JSON contracts
        run: python scripts/validate_json_contracts.py
      - name: Validate versioned public schemas
        run: python scripts/validate_public_schemas.py
      - name: Fetch immutable legacy reader source
        run: git fetch --no-tags --depth=1 origin 5a121dfe39fb978c7d71def0d08dc570aad83f1d
      - name: Verify legacy and current reader compatibility
        run: python scripts/check_review_reader_compatibility.py
      - name: Validate evaluation corpus
        run: python scripts/validate_evaluation_corpus.py
      - name: Validate site manifest
        run: python scripts/validate_site_manifest.py
      - name: Check generated site pages
        run: python scripts/build_site_pages.py --check
      - name: Validate protection policy contract
        run: python scripts/check_protection_policy.py --policy .github/protection-policy.json --promotion-ledger .publication/publication-ledger.jsonl
      - name: Prove CodeQL findings gate on committed fixtures
        run: |
          set +e
          python scripts/check_codeql_findings.py \
            --sarif-dir tests/fixtures/codeql/clean \
            --baseline security/codeql-baseline.json \
            --expected-reports 0 \
            --expected-languages python,javascript-typescript
          clean_status=$?
          python scripts/check_codeql_findings.py \
            --sarif-dir tests/fixtures/codeql/seeded-warning \
            --baseline security/codeql-baseline.json \
            --expected-reports 0 \
            --expected-languages python
          seeded_status=$?
          python scripts/check_codeql_findings.py \
            --sarif-dir tests/fixtures/codeql/malformed \
            --baseline security/codeql-baseline.json \
            --expected-reports 1
          malformed_status=$?
          set -e
          failed=0
          if [ "$clean_status" -ne 0 ]; then
            echo "clean fixture must pass the findings gate" >&2
            failed=1
          fi
          if [ "$seeded_status" -eq 0 ]; then
            echo "seeded warning fixture must fail the findings gate" >&2
            failed=1
          fi
          if [ "$malformed_status" -eq 0 ]; then
            echo "malformed SARIF fixture must fail the findings gate" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - name: Run deterministic fixture evaluation
        run: |
          python -m review_sensei evaluate --mode fixture \
            --corpus evaluation/v1/corpus.json \
            --output "$RUNNER_TEMP/evaluation-report.json"

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install build tools
        run: python -m pip install -r requirements/ci.txt
      - name: Build sdist and wheel
        shell: bash
        run: |
          rm -rf dist
          python -m build --outdir dist
          python -m build --wheel --outdir dist/github packages/python/review-sensei-github
      - name: Check sdist contents against the distribution contract
        run: python scripts/check_sdist_contract.py
      - name: Record distribution digests
        shell: bash
        run: sha256sum dist/*.tar.gz dist/*.whl | tee dist/SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-sensei-distributions
          path: dist/**
      - name: Verify wheel and dist-safe suite outside checkout
        shell: bash
        run: |
          wheel_venv="$RUNNER_TEMP/review-sensei-wheel-venv"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_venv/bin/python" - <<'PY'
          import importlib.resources
          import pathlib
          import sys

          import review_sensei

          package_path = pathlib.Path(review_sensei.__file__).resolve()
          prefix = pathlib.Path(sys.prefix).resolve()
          assert prefix in package_path.parents, (package_path, prefix)
          for name in (
              "review-category.schema.json",
              "review-stage.schema.json",
              "learning-entry.schema.json",
              "evaluation-corpus.schema.json",
              "evaluation-report.schema.json",
              "promotion-record.schema.json",
          ):
              assert importlib.resources.files("review_sensei").joinpath("schemas", name).is_file()
          PY
          "$wheel_venv/bin/python" -I -m review_sensei --help
          "$wheel_venv/bin/python" - <<'PY'
          import subprocess
          import sys

          help_text = subprocess.check_output(
              [sys.executable, "-m", "review_sensei", "--help"], text=True
          )
          if "--github-session-ledger" in help_text or " resolve-hosted-openrouter" in help_text:
              raise SystemExit("engine help still exposes hosted commands")
          PY
          "$wheel_venv/bin/python" -m pip install --disable-pip-version-check "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/github/*.whl
          sdist_root="$RUNNER_TEMP/review-sensei-sdist"
          mkdir -p "$sdist_root"
          tar -xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz -C "$sdist_root"
          suite="$(printf '%s\n' "$sdist_root"/review_sensei-*/tests | head -n 1)"
          test -d "$suite/dist_safe"
          test -d "$suite/downstream"
          test -f "$suite/fake_github_http.py"
          test ! -e "$suite/test_ci_policy.py"
          export REVIEWSENSEI_CHECKOUT_ROOT="$GITHUB_WORKSPACE"
          export REVIEWSENSEI_DIST_SAFE_LANE=1
          REVIEWSENSEI_EXPECTED_VERSION="$(cd "$GITHUB_WORKSPACE" && python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          export REVIEWSENSEI_EXPECTED_VERSION
          "$wheel_venv/bin/python" -I -m unittest discover -s "$suite/dist_safe" -v
          "$wheel_venv/bin/python" -I -m unittest discover -s "$suite/downstream" -v
          # Exercise canonical custom-endpoint authority using the exact wheel
          # and an injected transport; this suite forbids socket connections.
          "$wheel_venv/bin/python" -I "$GITHUB_WORKSPACE/tests/published_cli/openai_configuration.py" \
            --wheel "$GITHUB_WORKSPACE"/dist/*.whl \
            --expected-version "$REVIEWSENSEI_EXPECTED_VERSION" \
            --report "$RUNNER_TEMP/openai-configuration-wheel.json"
          "$wheel_venv/bin/python" -m pip check

  npm:
    name: Node launcher and npm package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install package and CI tools
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip install -e .
          python -m pip install -e packages/python/review-sensei-github --no-deps
      - name: Run launcher tests
        run: node --test packages/npm/cli/test/launcher.test.js
      - name: Validate npm manifests and synthetic package cases
        run: python -m unittest tests.test_npm_distribution -v
      - name: Pack launcher without lifecycle hooks
        run: npm pack --ignore-scripts --dry-run --json packages/npm/cli
      - name: Validate publication boundary
        # The manifest is intentionally excluded from the public projection;
        # private CI must validate it, while public CI must not require it.
        if: ${{ hashFiles('.publication/exclusions.json') != '' }}
        run: python scripts/validate_publication_boundary.py --print-files

  linux-standalone:
    name: Linux standalone baseline (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: linux-x64-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Build and smoke on Debian 12
        shell: bash
        run: bash scripts/build_linux_standalone_in_container.sh "${{ matrix.target }}"

      - name: Archive exact Linux native candidate
        run: python scripts/qualify_candidate_artifacts.py archive --target "${{ matrix.target }}" --input "dist/standalone/${{ matrix.target }}/review-sensei" --output "dist/candidate-native/${{ matrix.target }}" --source-sha "${{ github.sha }}"
      - name: Retain exact Linux native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-native-${{ matrix.target }}
          path: dist/candidate-native/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  intel-standalone:
    name: Intel macOS standalone ABI and parity
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Keep the actual failing framework/OpenSSL combination as a regression.
          python-version: '3.11.9'
      - name: Install statically linked native oracle
        run: python scripts/install_standalone_oracle.py --target darwin-x64
      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check -r packaging/standalone/requirements.txt
      - name: Build Intel standalone
        run: python scripts/build_standalone.py --target darwin-x64 --output dist/standalone/darwin-x64
      - name: Verify frozen crypto linkage and RSA signing
        run: python scripts/check_standalone_crypto.py --bundle dist/standalone/darwin-x64/review-sensei --report "$RUNNER_TEMP/frozen-crypto.json"
      - name: Retain strict native CLI parity
        env:
          PYTHONPATH: src
        run: |
          python scripts/standalone_smoke.py \
            --executable dist/standalone/darwin-x64/review-sensei/review-sensei \
            --repository "$GITHUB_WORKSPACE" \
            --diff evaluation/v1/diffs/off-by-one.patch \
            --fixture-response evaluation/v1/responses/off-by-one.json \
            --base-ref "$(git rev-parse HEAD^)" \
            --head-ref "$(git rev-parse HEAD)"
      - name: Retain verified native ABI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frozen-intel-crypto-check
          path: ${{ runner.temp }}/frozen-crypto.json
          if-no-files-found: warn

      - name: Archive exact Intel native candidate
        run: python scripts/qualify_candidate_artifacts.py archive --target darwin-x64 --input dist/standalone/darwin-x64/review-sensei --output dist/candidate-native/darwin-x64 --source-sha "${{ github.sha }}"
      - name: Retain exact Intel native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-native-darwin-x64
          path: dist/candidate-native/darwin-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-candidate:
    name: Additional native candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packaging/standalone/requirements.txt
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install native oracle and pinned builder
        run: |
          python scripts/install_standalone_oracle.py --target "${{ matrix.target }}"
          python -m pip install -r packaging/standalone/requirements.txt
      - name: Build missing candidate target
        run: python scripts/build_standalone.py --target "${{ matrix.target }}" --output "dist/standalone/${{ matrix.target }}"
      - name: Smoke and archive native candidate
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          executable="dist/standalone/${{ matrix.target }}/review-sensei/review-sensei"
          if [[ "${{ matrix.target }}" == win32-x64 ]]; then executable+=".exe"; fi
          python scripts/standalone_smoke.py --executable "$executable" --repository "$GITHUB_WORKSPACE" --diff evaluation/v1/diffs/off-by-one.patch --fixture-response evaluation/v1/responses/off-by-one.json --base-ref "$(git rev-parse HEAD^)" --head-ref "$(git rev-parse HEAD)"
          python scripts/qualify_candidate_artifacts.py archive --target "${{ matrix.target }}" --input "dist/standalone/${{ matrix.target }}/review-sensei" --output "dist/candidate-native/${{ matrix.target }}" --source-sha "$(git rev-parse HEAD)"
      - name: Retain exact native candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-native-${{ matrix.target }}
          path: dist/candidate-native/${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  candidate-npm:
    name: Assemble exact candidate npm tarballs
    needs: [linux-standalone, intel-standalone, native-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned pack CLI
        run: npm install --global npm@11.5.1
      - name: Download all five exact native bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-native-*
          path: dist/candidate-download
          merge-multiple: false
      - name: Verify native receipts, assemble and pack without lifecycle scripts
        run: python scripts/qualify_candidate_artifacts.py assemble --input dist/candidate-download --output dist/candidate-npm --source-sha "${{ github.sha }}"
      - name: Retain exact unpublished npm tarballs and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-npm-tarballs
          path: dist/candidate-npm/packed
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  candidate-consumer:
    name: Installed candidate launcher and native (${{ matrix.target }})
    needs: candidate-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: linux-x64-gnu
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install parity oracle and pinned installer
        run: |
          python -m pip install .
          npm install --global npm@11.5.1
      - name: Download exact packed candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-npm-tarballs
          path: dist/candidate-packed
      - name: Install selected local tarballs offline and smoke actual installed bytes
        run: python scripts/qualify_candidate_artifacts.py consume --target "${{ matrix.target }}" --input dist/candidate-packed --output dist/candidate-consumer --source-sha "${{ github.sha }}"
      - name: Retain installed candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-consumer-${{ matrix.target }}
          path: dist/candidate-consumer
          if-no-files-found: error
          retention-days: 7

  workers:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare
        run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
            packages/python/review-sensei-github/pyproject.toml
      - name: Install Python IPC qualification dependencies
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip install -e .
          python -m pip install -e packages/python/review-sensei-github --no-deps
      - name: Qualify production feedback broker IPC
        env:
          EPIC238_F_MEASUREMENTS: ${{ runner.temp }}/feedback-broker-ipc-metrics.json
        run: python -W error::ResourceWarning -m tests.epic238_feedback_broker_qualification -v
      - name: Qualify original broker physical dispatch accounting
        run: python -W error::ResourceWarning -m tests.epic238_broker_control_qualification -v
      - name: Qualify supported media CLI with production broker accounting
        env:
          REVIEWSENSEI_MEDIA_BROKER_QUALIFICATION: "1"
        run: python -W error::ResourceWarning -m unittest tests.test_media_cli_activation tests.test_hosted_disposition_snapshots -v
      - name: Qualify coalesced original assessment admission
        run: python -W error::ResourceWarning -m tests.epic238_initial_tail_qualification -v
      - name: Qualify current review caller and production Worker composition
        run: python -W error::ResourceWarning -m unittest tests.api_work_worker_qualification -v
      - name: Qualify current command caller and production Worker composition
        run: python -W error::ResourceWarning -m unittest tests.action_run_worker_qualification -v
      - name: Qualify isolated quarantine and production Worker composition
        run: python -W error::ResourceWarning -m unittest tests.quarantine_worker_qualification -v
      - name: Qualify body-limit and published-tail recovery with production Worker
        run: python -W error::ResourceWarning -m unittest tests.quarantine_body_worker_qualification tests.quarantine_published_tail_worker_qualification -v
      - name: Run Worker tests
        working-directory: deploy/cloudflare
        run: npm test
      - name: Typecheck Worker
        working-directory: deploy/cloudflare
        run: npm run typecheck
      - name: Generate Worker bindings
        working-directory: deploy/cloudflare
        run: npx wrangler types "$RUNNER_TEMP/reviewsensei-worker-env.d.ts"
      - name: Validate Worker dry-run bundle
        working-directory: deploy/cloudflare
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/reviewsensei-64-worker"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Upload is intentionally disabled until the repository capability is
          # enabled; the deterministic local gate below remains enforcement.
          upload: never
          output: ${{ runner.temp }}/codeql-results
          category: review-sensei/language:${{ matrix.language }}
      - name: Enforce reviewed CodeQL findings baseline
        if: ${{ success() }}
        run: |
          python scripts/check_codeql_findings.py \
            --sarif-dir "$RUNNER_TEMP/codeql-results" \
            --baseline security/codeql-baseline.json \
            --expected-reports 0 \
            --expected-languages "${{ matrix.language }}"
      - name: Archive CodeQL SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error

  required-checks:
    name: Required checks
    if: ${{ !cancelled() }}
    needs: [compatibility, quality, schemas, package, npm, linux-standalone, intel-standalone, native-candidate, candidate-npm, candidate-consumer, workers, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          # A skipped required job is intentionally not accepted: branch
          # protection must never treat an incomplete gate as green.
          require_success() {
            if [ "$1" != success ]; then
              echo "Required gate result was $1" >&2
              return 1
            fi
          }
          require_success "${{ needs.compatibility.result }}"
          require_success "${{ needs.quality.result }}"
          require_success "${{ needs.schemas.result }}"
          require_success "${{ needs.package.result }}"
          require_success "${{ needs.npm.result }}"
          require_success "${{ needs.linux-standalone.result }}"
          require_success "${{ needs.intel-standalone.result }}"
          require_success "${{ needs.native-candidate.result }}"
          require_success "${{ needs.candidate-npm.result }}"
          require_success "${{ needs.candidate-consumer.result }}"
          require_success "${{ needs.workers.result }}"
          require_success "${{ needs.codeql.result }}"

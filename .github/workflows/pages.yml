name: Deploy site to GitHub Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release run ID (latest qualified version only)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify released documentation
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # This helper is trusted default-branch code. Release artifacts are data;
      # no downloaded script or released checkout runs with Pages/OIDC grants.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Select exact successful release run
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}
        run: >-
          python scripts/release_docs.py select
          --run-id "$RELEASE_RUN_ID"
          --output "$RUNNER_TEMP/release-selection.json"
      - name: Download only the qualified static artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || inputs.release_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-docs
      - name: Recheck cutoff and verify docs provenance and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_docs.py verify
          --selection "$RUNNER_TEMP/release-selection.json"
          --bundle "$RUNNER_TEMP/release-docs"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/release-docs/site

  deploy:
    name: Deploy qualified released docs
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Environment approval may take hours. Recheck the immutable cutoff and
      # high-water mark after approval, using only trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Recheck release cutoff after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SELECTION: ${{ needs.qualify.outputs.selection }}
        run: >-
          python scripts/release_docs.py recheck
          --selection-json "$RELEASE_SELECTION"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

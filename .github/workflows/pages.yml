name: Deploy site to GitHub Pages

on:
  workflow_run:
    workflows: [Release, Release npm]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release run ID (latest qualified version only)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify released documentation
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
      # This helper is trusted default-branch code. Release artifacts are data;
      # no downloaded script or released checkout runs with Pages/OIDC grants.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Wait for matching npm publication before documentation verification
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python scripts/wait_for_publication.py --workflow publish-npm.yml
          --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE"
          --pages-core-run-id "$RELEASE_RUN_ID"
          --report "$RUNNER_TEMP/pages-npm-readiness.json"
      - name: Retain npm publication readiness receipt
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-npm-publication-readiness
          path: ${{ runner.temp }}/pages-npm-readiness.json
          if-no-files-found: error
      - name: Select exact successful release run
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}
        run: >-
          python scripts/release_docs.py select
          --run-id "$RELEASE_RUN_ID"
          --output "$RUNNER_TEMP/release-selection.json"
      - name: Download only the qualified static artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ fromJSON(steps.selection.outputs.selection).release_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-docs
      - name: Recheck cutoff and verify docs provenance and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_docs.py verify
          --selection "$RUNNER_TEMP/release-selection.json"
          --bundle "$RUNNER_TEMP/release-docs"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/release-docs/site

  deploy:
    name: Deploy qualified released docs
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Environment approval may take hours. Recheck the immutable cutoff and
      # high-water mark after approval, using only trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Recheck release cutoff after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SELECTION: ${{ needs.qualify.outputs.selection }}
        run: >-
          python scripts/release_docs.py recheck
          --selection-json "$RELEASE_SELECTION"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  update-main:
    if: github.ref == 'refs/heads/main'
    name: Commit generated release documentation to main
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-docs-main
    permissions:
      contents: read
      actions: read
    concurrency:
      group: release-docs-main
      cancel-in-progress: false
    steps:
      # The environment releases its key only to main; the default token is read-only.
      # Downloaded HTML/JSON is data, never a script or a workflow checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download the same qualified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(needs.qualify.outputs.selection).artifact_id }}
          merge-multiple: true
          run-id: ${{ fromJSON(needs.qualify.outputs.selection).release_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-docs
      - name: Mint a repository-only dedicated release docs token
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_DOCS_APP_CLIENT_ID || vars.RELEASE_DOCS_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOCS_APP_PRIVATE_KEY }}
          owner: malsabbagh
          repositories: review-sensei
          permission-contents: write
          permission-actions: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Integrate generated docs with fresh main under repository rules
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          RELEASE_DOCS_APP_ID: ${{ vars.RELEASE_DOCS_APP_ID }}
          RELEASE_DOCS_APP_SLUG: ${{ steps.docs-token.outputs.app-slug }}
          RELEASE_SELECTION: ${{ needs.qualify.outputs.selection }}
          GIT_TERMINAL_PROMPT: "0"
        run: >-
          python scripts/sync_release_docs.py
          --bundle "$RUNNER_TEMP/release-docs"
          --selection-json "$RELEASE_SELECTION"

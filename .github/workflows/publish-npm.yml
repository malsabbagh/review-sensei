name: Publish npm packages

# Must stay byte-identical to the Python resume check: f"publish-npm {version}"
run-name: publish-npm ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact npm package version, for example 0.1.0"
        required: true
        type: string
        default: "0.6.6"
      publish:
        description: "Publish after validation (false prepares only the attested package bundle)"
        required: true
        type: boolean
        default: false
      bootstrap:
        description: "Use the one-time NPM_TOKEN bootstrap for 0.1.0 only"
        required: true
        type: boolean
        default: false
      resume_bundle_run_id:
        description: "Optional failed workflow run ID whose attested npm release bundle should be reused instead of rebuilding"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Matches release.yml's tag job group (publish-npm-vX.Y.Z).
  group: publish-npm-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-request:
    name: Verify public npm release request
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      resume_mode: ${{ steps.source.outputs.resume_mode }}
    steps:
      - name: Require the canonical public default branch
        env:
          EXPECTED_REPOSITORY: malsabbagh/review-sensei
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$BOOTSTRAP" = "true" || test "$BOOTSTRAP" = "false"

      - name: Check out the immutable dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate source and release version
        id: source
        env:
          VERSION: ${{ inputs.version }}
          RESUME_BUNDLE_RUN_ID: ${{ inputs.resume_bundle_run_id }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          python scripts/check_release_version.py --tag "v$VERSION"
          if [[ -n "$RESUME_BUNDLE_RUN_ID" ]]; then
            if [[ ! "$RESUME_BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "resume_bundle_run_id must be a numeric workflow run ID"
              exit 1
            fi
            printf 'resume_mode=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'resume_mode=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  native-build:
    name: Native standalone (${{ matrix.target }})
    needs: verify-request
    if: ${{ needs.verify-request.outputs.resume_mode != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: linux-x64-gnu
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-request.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Python
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install standalone smoke oracle
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python -m pip install --disable-pip-version-check .

      - name: Install pinned PyInstaller
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python -m pip install --disable-pip-version-check -r packaging/standalone/requirements.txt

      - name: Build one-folder standalone executable
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python scripts/build_standalone.py --target "${{ matrix.target }}" --output "dist/standalone/${{ matrix.target }}"

      - name: Run native standalone smoke equivalence
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          executable="dist/standalone/${{ matrix.target }}/review-sensei/review-sensei"
          if [[ "${{ matrix.target }}" == "win32-x64" ]]; then
            executable+=".exe"
          fi
          base_ref="$(git rev-parse HEAD^)"
          head_ref="$(git rev-parse HEAD)"
          python scripts/standalone_smoke.py \
            --executable "$executable" \
            --repository "$GITHUB_WORKSPACE" \
            --diff evaluation/v1/diffs/off-by-one.patch \
            --fixture-response evaluation/v1/responses/off-by-one.json \
            --base-ref "$base_ref" \
            --head-ref "$head_ref"

      - name: Build and smoke Linux standalone on Debian 12
        if: ${{ startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: bash scripts/build_linux_standalone_in_container.sh "${{ matrix.target }}"

      - name: Upload native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-sensei-standalone-${{ matrix.target }}
          if-no-files-found: error
          path: dist/standalone/${{ matrix.target }}/review-sensei

  assemble-npm:
    name: Assemble and validate npm package set
    needs: [verify-request, native-build]
    # Skipped on resume dispatches and when native-build did not succeed.
    if: ${{ needs.verify-request.outputs.resume_mode != 'true' && needs.verify-request.result == 'success' && needs.native-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-request.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned npm pack CLI
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Download native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # v8 keeps merge-multiple=false layout: one named directory per artifact.
          pattern: review-sensei-standalone-*
          path: dist/native
          merge-multiple: false

      - name: Restore POSIX executable modes
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            root="dist/native/review-sensei-standalone-$target"
            mapfile -t payloads < <(find "$root" -type f -name review-sensei -print)
            test "${#payloads[@]}" -eq 1
            chmod u=rwx,go=rx "${payloads[0]}"
          done

      - name: Assemble six package directories
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python scripts/prepare_npm_packages.py \
            --output dist/npm \
            --bundle darwin-arm64=dist/native/review-sensei-standalone-darwin-arm64 \
            --bundle darwin-x64=dist/native/review-sensei-standalone-darwin-x64 \
            --bundle linux-arm64-gnu=dist/native/review-sensei-standalone-linux-arm64-gnu \
            --bundle linux-x64-gnu=dist/native/review-sensei-standalone-linux-x64-gnu \
            --bundle win32-x64=dist/native/review-sensei-standalone-win32-x64
          python scripts/validate_npm_package.py dist/npm --expected-version "$VERSION"
          python scripts/check_release_version.py --tag "v$VERSION"

      - name: Run native smoke harness where the runner can execute it
        shell: bash
        run: |
          set -euo pipefail
          python scripts/standalone_smoke.py --executable dist/npm/linux-x64-gnu/bin/review-sensei --check

      - name: Pack and validate exact npm tarballs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/npm
          packages=(cli darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu win32-x64)
          : > release/npm/SHA256SUMS
          : > release/npm/integrity.jsonl
          for package in "${packages[@]}"; do
            npm pack --ignore-scripts --json --pack-destination release/npm "dist/npm/$package" > "release/npm/$package.pack.json"
            tarball=$(python - "$package" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path("release/npm", f"{sys.argv[1]}.pack.json").read_text())
          print(value[0]["filename"])
          PY
            )
            python scripts/validate_npm_package.py "release/npm/$tarball" --expected-version "$VERSION"
            python - "$package" "$tarball" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import sys
          package_record = json.loads(pathlib.Path("release/npm", f"{sys.argv[1]}.pack.json").read_text())[0]
          path = pathlib.Path("release/npm", sys.argv[2])
          digest = hashlib.sha256(path.read_bytes()).digest()
          hex_digest = digest.hex()
          sri = "sha512-" + base64.b64encode(hashlib.sha512(path.read_bytes()).digest()).decode("ascii")
          with pathlib.Path("release/npm/SHA256SUMS").open("a", encoding="utf-8") as sums:
              sums.write(f"{hex_digest}  {path.name}\n")
          with pathlib.Path("release/npm/integrity.jsonl").open("a", encoding="utf-8") as record:
              record.write(json.dumps({"file": path.name, "name": package_record["name"], "version": package_record["version"], "sha256": hex_digest, "integrity": sri}) + "\n")
          PY
          done
          python scripts/write_bundle_metadata.py \
            --bundle-dir release/npm \
            --version "$VERSION" \
            --source-sha "$(git rev-parse HEAD)"

      - name: Attest exact npm tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/npm/SHA256SUMS

      - name: Upload exact npm release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-sensei-npm-release-bundle
          if-no-files-found: error
          path: |
            release/npm/*.tgz
            release/npm/SHA256SUMS
            release/npm/integrity.jsonl
            release/npm/bundle-metadata.json

  publish-npm:
    name: Publish npm packages
    # Resume dispatches are selected by verify-request resume_mode; assemble-npm must
    # be skipped on that path so a fresh bundle was not assembled in this run.
    needs: [verify-request, native-build, assemble-npm]
    if: ${{ inputs.publish && always() && needs.verify-request.result == 'success' && ((needs.verify-request.outputs.resume_mode != 'true' && needs.native-build.result == 'success' && needs.assemble-npm.result == 'success') || (needs.verify-request.outputs.resume_mode == 'true' && needs.native-build.result == 'skipped' && needs.assemble-npm.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/reviewsensei
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Python for release metadata checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check out repository for resumed run validation
        if: ${{ needs.verify-request.outputs.resume_mode == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: resume-source
          persist-credentials: false
          show-progress: false

      - name: Install pinned npm Trusted Publishing CLI
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Download validated npm release bundle
        if: ${{ needs.verify-request.outputs.resume_mode != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Single-artifact downloads still extract directly into path in v8.
          name: review-sensei-npm-release-bundle
          path: release/npm

      - name: Download npm release bundle from prior workflow run
        id: resume-bundle
        if: ${{ needs.verify-request.outputs.resume_mode == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_BUNDLE_RUN_ID: ${{ inputs.resume_bundle_run_id }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SOURCE_SHA: ${{ needs.verify-request.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_SOURCE_SHA:-}" ]]; then
            echo "verify-request did not produce a dispatch source SHA" >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_BUNDLE_RUN_ID" --jq '{id,conclusion,path,event,head_branch,head_sha,repository:.repository.full_name,display_title}')"
          bundle_source_sha="$(python3 resume-source/scripts/validate_npm_resume_run.py \
            --run-id "$RESUME_BUNDLE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --version "$VERSION" \
            --dispatch-source-sha "$DISPATCH_SOURCE_SHA" <<< "$run_json")"
          git -C resume-source fetch origin "$bundle_source_sha"
          git -C resume-source cat-file -e "$bundle_source_sha^{commit}"
          git -C resume-source checkout --detach "$bundle_source_sha"
          python resume-source/scripts/check_release_version.py --tag "v$VERSION"
          resume_staging="$RUNNER_TEMP/resume-bundle-staging"
          rm -rf "$resume_staging"
          mkdir -p "$resume_staging"
          gh run download "$RESUME_BUNDLE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name review-sensei-npm-release-bundle \
            --dir "$resume_staging"
          python resume-source/scripts/publish_npm_release.py verify-bundle \
            --bundle-dir "$resume_staging" \
            --version "$VERSION" \
            --expected-source-sha "$bundle_source_sha"
          (
            cd "$resume_staging"
            sha256sum --check SHA256SUMS
            while IFS= read -r filename; do
              [[ -z "$filename" ]] && continue
              gh attestation verify "$filename" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-npm.yml" \
                --source-ref "refs/heads/$DEFAULT_BRANCH" \
                --source-digest "$bundle_source_sha"
            done < <(
              python resume-source/scripts/publish_npm_release.py list-attestation-subjects \
                --bundle-dir "$resume_staging"
            )
          )
          rm -rf release/npm
          mkdir -p release/npm
          cp -a "$resume_staging"/. release/npm/
          test -f release/npm/integrity.jsonl
          test -f release/npm/bundle-metadata.json
          test -f release/npm/SHA256SUMS
          echo "bundle_source_sha=$bundle_source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded npm tarball checksums
        shell: bash
        working-directory: release/npm
        run: sha256sum --check SHA256SUMS

      - name: Check out publish helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-request.outputs.source_sha }}
          fetch-depth: 1
          path: source
          persist-credentials: false
          show-progress: false

      - name: Assert helper checkout matches attested build source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify-request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain=v1)"
          test -f source/scripts/publish_npm_release.py

      - name: Verify resumed npm release bundle provenance
        if: ${{ needs.verify-request.outputs.resume_mode == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          bundle_source_sha="${{ steps.resume-bundle.outputs.bundle_source_sha }}"
          test -n "$bundle_source_sha"
          python resume-source/scripts/publish_npm_release.py verify-bundle \
            --bundle-dir "$GITHUB_WORKSPACE/release/npm" \
            --version "$VERSION" \
            --expected-source-sha "$bundle_source_sha"
          (
            cd "$GITHUB_WORKSPACE/release/npm"
            while IFS= read -r filename; do
              [[ -z "$filename" ]] && continue
              gh attestation verify "$filename" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-npm.yml" \
                --source-ref "refs/heads/$DEFAULT_BRANCH" \
                --source-digest "$bundle_source_sha"
            done < <(
              python resume-source/scripts/publish_npm_release.py list-attestation-subjects \
                --bundle-dir "$GITHUB_WORKSPACE/release/npm"
            )
          )

      - name: Configure bootstrap authentication when present
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP" == "true" ]]; then
            test "$VERSION" = "0.1.0"
            test -n "$NPM_TOKEN"
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          elif [[ -n "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN is configured but bootstrap=false; remove the bootstrap secret before Trusted Publishing."
            exit 1
          else
            echo "Using npm Trusted Publishing OIDC."
          fi

      - name: Verify registry state against attested tarballs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RESUME_SOURCE_SHA: ${{ steps.resume-bundle.outputs.bundle_source_sha }}
          RESUME_BUNDLE_RUN_ID: ${{ inputs.resume_bundle_run_id }}
        run: |
          set -euo pipefail
          args=(
            python source/scripts/publish_npm_release.py preflight
            --bundle-dir "$GITHUB_WORKSPACE/release/npm"
            --version "$VERSION"
          )
          if [[ -n "${RESUME_BUNDLE_RUN_ID}" ]]; then
            if [[ -z "${RESUME_SOURCE_SHA:-}" ]]; then
              echo "resume publish requires bundle_source_sha from resume-bundle step" >&2
              exit 1
            fi
            args+=(--expected-source-sha "$RESUME_SOURCE_SHA")
          fi
          "${args[@]}"

      - name: Publish platform packages first and read back integrity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python source/scripts/publish_npm_release.py publish-platforms
          --bundle-dir "$GITHUB_WORKSPACE/release/npm"
          --version "$VERSION"

      - name: Publish launcher last and read back integrity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          python source/scripts/publish_npm_release.py publish-launcher
          --bundle-dir "$GITHUB_WORKSPACE/release/npm"
          --version "$VERSION"

      - name: Verify a clean Linux consumer installation
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --ignore-scripts --prefix "$prefix" "@reviewsensei/cli@$VERSION"
          node - "$prefix" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const prefix = process.argv[2];
          const launcher = fs.realpathSync(
            path.join(prefix, "node_modules/@reviewsensei/cli/bin/review-sensei.js"),
          );
          const command = fs.realpathSync(
            path.join(prefix, "node_modules/.bin/review-sensei"),
          );
          if (command !== launcher) {
            throw new Error("review-sensei command is not owned by the launcher package");
          }
          NODE
          "$prefix/node_modules/.bin/review-sensei" --help >/dev/null
          npm audit signatures --prefix "$prefix"

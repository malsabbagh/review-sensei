name: Release npm

# The existing Release Marshal pushes one signed core tag; both channels consume it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  qualify-source:
    name: Qualify signed prepared source and exact-head CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag_object: ${{ steps.contract.outputs.tag_object }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Require the signed tag to bind the exact CI-qualified generated commit
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_channels.py qualify --channel npm --root "$GITHUB_WORKSPACE"
      - name: Require unchanged Mo approval gates before release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sign_release.py --check-publication-gates

  native-build:
    name: Native standalone (${{ matrix.target }})
    needs: qualify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: linux-x64-gnu
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install standalone smoke oracle
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python scripts/install_standalone_oracle.py --target "${{ matrix.target }}"
      - name: Install pinned PyInstaller
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python -m pip install --disable-pip-version-check -r packaging/standalone/requirements.txt
      - name: Build one-folder standalone executable
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: python scripts/build_standalone.py --target "${{ matrix.target }}" --output "dist/standalone/${{ matrix.target }}"
      - name: Verify frozen Intel cryptography ABI
        if: ${{ matrix.target == 'darwin-x64' }}
        run: python scripts/check_standalone_crypto.py --bundle dist/standalone/darwin-x64/review-sensei

      - name: Run native standalone smoke equivalence
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          executable="dist/standalone/${{ matrix.target }}/review-sensei/review-sensei"
          if [[ "${{ matrix.target }}" == "win32-x64" ]]; then
            executable+=".exe"
          fi
          base_ref="$(git rev-parse HEAD^)"
          head_ref="$(git rev-parse HEAD)"
          python scripts/standalone_smoke.py \
            --executable "$executable" \
            --repository "$GITHUB_WORKSPACE" \
            --diff evaluation/v1/diffs/off-by-one.patch \
            --fixture-response evaluation/v1/responses/off-by-one.json \
            --base-ref "$base_ref" \
            --head-ref "$head_ref"
      - name: Build and smoke Linux standalone on Debian 12
        if: ${{ startsWith(matrix.target, 'linux-') }}
        shell: bash
        run: bash scripts/build_linux_standalone_in_container.sh "${{ matrix.target }}"
      - name: Upload native bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-sensei-standalone-${{ matrix.target }}
          if-no-files-found: error
          path: dist/standalone/${{ matrix.target }}/review-sensei

  assemble-npm:
    name: Assemble and validate npm package set
    needs: native-build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      build_attempt: ${{ steps.source.outputs.attempt }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned npm pack CLI
        run: npm install --global npm@11.5.1
      - name: Download native bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # v8 keeps merge-multiple=false layout: one named directory per artifact.
          pattern: review-sensei-standalone-*
          path: dist/native
          merge-multiple: false
      - name: Restore POSIX executable modes
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            root="dist/native/review-sensei-standalone-$target"
            mapfile -t payloads < <(find "$root" -type f -name review-sensei -print)
            test "${#payloads[@]}" -eq 1
            chmod u=rwx,go=rx "${payloads[0]}"
          done
      - name: Assemble six package directories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_npm_packages.py \
            --output dist/npm \
            --bundle darwin-arm64=dist/native/review-sensei-standalone-darwin-arm64 \
            --bundle darwin-x64=dist/native/review-sensei-standalone-darwin-x64 \
            --bundle linux-arm64-gnu=dist/native/review-sensei-standalone-linux-arm64-gnu \
            --bundle linux-x64-gnu=dist/native/review-sensei-standalone-linux-x64-gnu \
            --bundle win32-x64=dist/native/review-sensei-standalone-win32-x64
          python scripts/validate_npm_package.py dist/npm --expected-version "${GITHUB_REF_NAME#v}"
          python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Install standalone smoke oracle
        # The oracle runs the checkout source's `python -m review_sensei`; this
        # job validates the packaged launcher, so the installed distribution is
        # only the comparison baseline.
        run: python -m pip install --disable-pip-version-check .
      - name: Run native smoke harness where the runner can execute it
        shell: bash
        run: |
          set -euo pipefail
          # The matrix already exercised the native executable. This check
          # re-runs the documented local review contract for the assembled
          # launcher package, including the clean-host, format, and exit-code
          # cases; clean-machine registry smoke remains a maintainer-owned gate.
          python scripts/standalone_smoke.py \
            --executable dist/npm/linux-x64-gnu/bin/review-sensei \
            --repository "$GITHUB_WORKSPACE" \
            --diff evaluation/v1/diffs/off-by-one.patch \
            --fixture-response evaluation/v1/responses/off-by-one.json
      - name: Pack and validate exact npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
          mkdir -p release/npm
          packages=(cli darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu win32-x64)
          : > release/npm/SHA256SUMS
          : > release/npm/integrity.jsonl
          for package in "${packages[@]}"; do
            npm pack --ignore-scripts --json --pack-destination release/npm "dist/npm/$package" > "release/npm/$package.pack.json"
            tarball=$(python - "$package" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path("release/npm", f"{sys.argv[1]}.pack.json").read_text())
          print(value[0]["filename"])
          PY
            )
            python scripts/validate_npm_package.py "release/npm/$tarball" --expected-version "${GITHUB_REF_NAME#v}"
            python - "$package" "$tarball" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import sys
          package_record = json.loads(pathlib.Path("release/npm", f"{sys.argv[1]}.pack.json").read_text())[0]
          path = pathlib.Path("release/npm", sys.argv[2])
          digest = hashlib.sha256(path.read_bytes()).digest()
          hex_digest = digest.hex()
          sri = "sha512-" + base64.b64encode(hashlib.sha512(path.read_bytes()).digest()).decode("ascii")
          with pathlib.Path("release/npm/SHA256SUMS").open("a", encoding="utf-8") as sums:
              sums.write(f"{hex_digest}  {path.name}\n")
          with pathlib.Path("release/npm/integrity.jsonl").open("a", encoding="utf-8") as record:
              record.write(json.dumps({"file": path.name, "name": package_record["name"], "version": package_record["version"], "sha256": hex_digest, "integrity": sri}) + "\n")
          PY
          done
          python scripts/write_bundle_metadata.py \
            --bundle-dir release/npm \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$(git rev-parse HEAD)"
      - name: Attest exact npm tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/npm/SHA256SUMS
      - name: Upload exact npm release bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-sensei-npm-release-bundle
          if-no-files-found: error
          path: |
            release/npm/*.tgz
            release/npm/SHA256SUMS
            release/npm/integrity.jsonl
            release/npm/bundle-metadata.json
      - name: Record attested source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm packages with Trusted Publishing
    needs: [qualify-source, assemble-npm]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-npm-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/org/reviewsensei
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Set up Python for release metadata checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned npm Trusted Publishing CLI
        run: npm install --global npm@11.5.1
      - name: Download validated npm release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Single-artifact downloads still extract directly into path in v8.
          artifact-ids: ${{ needs.assemble-npm.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: release/npm
      - name: Verify downloaded npm tarball checksums
        shell: bash
        working-directory: release/npm
        run: sha256sum --check SHA256SUMS
      - name: Check out publish helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.assemble-npm.outputs.source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
          show-progress: false
      - name: Assert helper checkout matches attested build source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.assemble-npm.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C source status --porcelain=v1)"
          test -f source/scripts/publish_npm_release.py

      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Requalify signed contract, exact artifact, provenance and published Python release
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ARTIFACT_ID: ${{ needs.assemble-npm.outputs.artifact_id }}
          BUNDLE_ARTIFACT_DIGEST: ${{ needs.assemble-npm.outputs.artifact_digest }}
          BUNDLE_BUILD_ATTEMPT: ${{ needs.assemble-npm.outputs.build_attempt }}
        run: >-
          python source/scripts/release_channels.py verify-npm
          --root "$GITHUB_WORKSPACE/source" --bundle "$GITHUB_WORKSPACE/release/npm"

      - name: Verify registry state against attested tarballs
        shell: bash
        run: >-
          python source/scripts/publish_npm_release.py preflight
          --bundle-dir "$GITHUB_WORKSPACE/release/npm"
          --version "${GITHUB_REF_NAME#v}"
          --expected-source-sha "${GITHUB_SHA}"

      - name: Publish platform packages first and read back integrity
        shell: bash
        run: >-
          python source/scripts/publish_npm_release.py publish-platforms
          --bundle-dir "$GITHUB_WORKSPACE/release/npm"
          --version "${GITHUB_REF_NAME#v}"

      - name: Publish launcher last and read back integrity
        shell: bash
        run: >-
          python source/scripts/publish_npm_release.py publish-launcher
          --bundle-dir "$GITHUB_WORKSPACE/release/npm"
          --version "${GITHUB_REF_NAME#v}"

      - name: Verify a clean Linux consumer installation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --ignore-scripts --prefix "$prefix" "@reviewsensei/cli@$VERSION"
          node - "$prefix" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const prefix = process.argv[2];
          const launcher = fs.realpathSync(
            path.join(prefix, "node_modules/@reviewsensei/cli/bin/review-sensei.js"),
          );
          const command = fs.realpathSync(
            path.join(prefix, "node_modules/.bin/review-sensei"),
          );
          if (command !== launcher) {
            throw new Error("review-sensei command is not owned by the launcher package");
          }
          NODE
          "$prefix/node_modules/.bin/review-sensei" --help >/dev/null
          npm audit signatures --prefix "$prefix"

  channel-result:
    name: Record independent npm channel result
    needs: [qualify-source, native-build, assemble-npm, publish-npm]
    if: ${{ always() && needs.qualify-source.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Retain authenticated channel facts without changing failed job results
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_channels.py record --channel npm
          --output "$RUNNER_TEMP/channel-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-result.json
          if-no-files-found: error
          retention-days: 90

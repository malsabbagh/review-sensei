name: Check release documentation bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-docs-main
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-docs-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Mint a repository-only dedicated release docs token
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_DOCS_APP_CLIENT_ID || vars.RELEASE_DOCS_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOCS_APP_PRIVATE_KEY }}
          owner: malsabbagh
          repositories: review-sensei
          permission-contents: write
          permission-actions: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Verify identity, repository scope and effective main rules without writing
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          RELEASE_DOCS_APP_ID: ${{ vars.RELEASE_DOCS_APP_ID }}
          RELEASE_DOCS_APP_SLUG: ${{ steps.docs-token.outputs.app-slug }}
          GIT_TERMINAL_PROMPT: "0"
        run: python scripts/sync_release_docs.py --check-bot

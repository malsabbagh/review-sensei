name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  qualify-source:
    name: Qualify signed prepared source and exact-head CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag_object: ${{ steps.contract.outputs.tag_object }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Require the signed tag to bind the exact CI-qualified generated commit
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_channels.py qualify --channel python --root "$GITHUB_WORKSPACE"
      - name: Require unchanged Mo approval gates before release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sign_release.py --check-publication-gates

  docs-build:
    name: Build release documentation
    needs: qualify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact release event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate and build released docs and examples metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_docs.py build
          --tag "$GITHUB_REF_NAME"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/release-docs"
      - name: Retain static release docs bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-sensei-release-docs
          path: ${{ runner.temp }}/release-docs
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  build:
    name: Build and attest release bundle
    needs: qualify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check tag and version consistency
        run: python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate release artifacts
        run: python scripts/validate_release.py dist --version "${GITHUB_REF_NAME#v}"

      - name: Smoke test the wheel outside the checkout
        env:
          WHEEL_ENV: ${{ runner.temp }}/review-sensei-wheel
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          wheels=()
          while IFS= read -r -d '' wheel; do
            wheels+=("$wheel")
          done < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print0)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel in dist/" >&2
            exit 1
          fi
          python -m venv "$WHEEL_ENV"
          "$WHEEL_ENV/bin/python" -m pip install --disable-pip-version-check "${wheels[0]}"
          "$WHEEL_ENV/bin/python" -m pip check
          "$WHEEL_ENV/bin/review-sensei" --help

      - name: Prepare release metadata directory
        run: mkdir -p release

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release/review-sensei-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Create release checksums
        run: |
          (cd dist && sha256sum -- *.tar.gz *.whl) > release/SHA256SUMS
          (cd release && sha256sum -- review-sensei-sbom.spdx.json) >> release/SHA256SUMS

      - name: Attest package checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Upload validated release bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-sensei-release-bundle
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.whl
            release/SHA256SUMS
            release/review-sensei-sbom.spdx.json

  publish:
    name: Publish to PyPI with Trusted Publishing
    needs: [qualify-source, build, draft-release]
    concurrency:
      group: publish-pypi-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/review-sensei
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Requalify immutable Python contract after approval
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_channels.py qualify --channel python --root "$GITHUB_WORKSPACE"
      - name: Download validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: .

      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          verify-metadata: true
          skip-existing: false
          attestations: true

  draft-release:
    name: Prepare draft GitHub release
    needs: [qualify-source, build, docs-build]
    runs-on: ubuntu-latest
    # Serialize draft/finalizer work across all attempts of this exact tag.
    concurrency:
      group: github-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Download same-run validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/github-release-bundle
      - name: Requalify original signed Python contract before GitHub release writes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
        run: python source/scripts/release_channels.py qualify --channel python --root "$GITHUB_WORKSPACE/source"
      - name: Verify signed source, attestations and GitHub release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python source/scripts/github_release.py draft
          --root "$GITHUB_WORKSPACE/source"
          --bundle "$RUNNER_TEMP/github-release-bundle"
          --tag "$GITHUB_REF_NAME"

  github-release:
    name: Create GitHub release assets
    needs: [qualify-source, build, draft-release, publish]
    runs-on: ubuntu-latest
    # Share the draft job's per-tag group; retries cancel no running attempt.
    concurrency:
      group: github-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned manifest validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Download same-run validated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/github-release-bundle
      - name: Requalify original signed Python contract before GitHub release writes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
        run: python source/scripts/release_channels.py qualify --channel python --root "$GITHUB_WORKSPACE/source"
      - name: Verify signed source, attestations and GitHub release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python source/scripts/github_release.py publish
          --root "$GITHUB_WORKSPACE/source"
          --bundle "$RUNNER_TEMP/github-release-bundle"
          --tag "$GITHUB_REF_NAME"

  channel-result:
    name: Record independent python channel result
    needs: [qualify-source, docs-build, build, draft-release, publish, github-release]
    if: ${{ always() && needs.qualify-source.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Retain authenticated channel facts without changing failed job results
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.qualify-source.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_channels.py record --channel python
          --output "$RUNNER_TEMP/channel-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-result.json
          if-no-files-found: error
          retention-days: 90

name: Protection policy readback

on:
  workflow_dispatch:
    inputs:
      ruleset_id:
        description: Active branch ruleset ID to capture and compare
        required: true
        type: string
      tag_ruleset_id:
        description: Immutable semantic-version tag ruleset ID (requires channel_ruleset_id)
        required: false
        type: string
      channel_ruleset_id:
        description: Movable v4 channel tag ruleset ID (requires tag_ruleset_id)
        required: false
        type: string

permissions:
  contents: read

jobs:
  readback:
    name: Compare live ruleset
    runs-on: ${{ vars.ENABLE_UBICLOUD_HOSTED == 'true' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate ruleset read credential scope
        env:
          GH_TOKEN: ${{ secrets.REVIEWSENSEI_RULESET_READ_TOKEN }}
          RULESET_ID: ${{ inputs.ruleset_id }}
          TAG_RULESET_ID: ${{ inputs.tag_ruleset_id }}
          CHANNEL_RULESET_ID: ${{ inputs.channel_ruleset_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Configure the REVIEWSENSEI_RULESET_READ_TOKEN secret before running readback" >&2
            exit 1
          fi
          if [[ ! "$RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "ruleset_id must be a positive integer" >&2
            exit 1
          fi
          ids=("$RULESET_ID")
          if [[ -n "${TAG_RULESET_ID:-}" || -n "${CHANNEL_RULESET_ID:-}" ]]; then
            if [[ ! "${TAG_RULESET_ID:-}" =~ ^[1-9][0-9]*$ || ! "${CHANNEL_RULESET_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "tag_ruleset_id and channel_ruleset_id must both be positive integers" >&2
              exit 1
            fi
            ids+=("$TAG_RULESET_ID" "$CHANNEL_RULESET_ID")
          fi
          for id in "${ids[@]}"; do
            response="$RUNNER_TEMP/reviewsensei-token-check"
            gh api --include \
              "repos/${GITHUB_REPOSITORY}/rulesets/${id}" \
              > "$response"
            scopes="$(awk -F': ' 'tolower($1) == "x-oauth-scopes" {print tolower($2)}' "$response" | tr -d '\r')"
            if [[ "$scopes" == *"repo"* || "$scopes" == *"admin:"* || "$scopes" == *"workflow"* || "$scopes" == *"delete_repo"* ]]; then
              echo "REVIEWSENSEI_RULESET_READ_TOKEN exposes broad classic OAuth scopes: $scopes" >&2
              exit 1
            fi
            rm -f "$response"
          done
      - name: Capture active ruleset readback
        env:
          GH_TOKEN: ${{ secrets.REVIEWSENSEI_RULESET_READ_TOKEN }}
          RULESET_ID: ${{ inputs.ruleset_id }}
          TAG_RULESET_ID: ${{ inputs.tag_ruleset_id }}
          CHANNEL_RULESET_ID: ${{ inputs.channel_ruleset_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Configure the REVIEWSENSEI_RULESET_READ_TOKEN secret before running readback" >&2
            exit 1
          fi
          if [[ ! "$RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "ruleset_id must be a positive integer" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/protection-readback"
          gh api --fail-with-body \
            "repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" \
            > "$RUNNER_TEMP/protection-readback/branch-ruleset.json"
          if [[ -n "${TAG_RULESET_ID:-}" || -n "${CHANNEL_RULESET_ID:-}" ]]; then
            if [[ ! "${TAG_RULESET_ID:-}" =~ ^[1-9][0-9]*$ || ! "${CHANNEL_RULESET_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "tag_ruleset_id and channel_ruleset_id must both be positive integers" >&2
              exit 1
            fi
            gh api --fail-with-body \
              "repos/${GITHUB_REPOSITORY}/rulesets/${TAG_RULESET_ID}" \
              > "$RUNNER_TEMP/protection-readback/immutable-tag-ruleset.json"
            gh api --fail-with-body \
              "repos/${GITHUB_REPOSITORY}/rulesets/${CHANNEL_RULESET_ID}" \
              > "$RUNNER_TEMP/protection-readback/v4-channel-ruleset.json"
          fi
      - name: Validate protection policy against readback
        env:
          TAG_RULESET_ID: ${{ inputs.tag_ruleset_id }}
          CHANNEL_RULESET_ID: ${{ inputs.channel_ruleset_id }}
        run: |
          set -euo pipefail
          args=(
            python scripts/check_protection_policy.py
            --policy .github/protection-policy.json
            --readback "$RUNNER_TEMP/protection-readback/branch-ruleset.json"
          )
          if [[ -n "${TAG_RULESET_ID:-}" || -n "${CHANNEL_RULESET_ID:-}" ]]; then
            args+=(
              --tag-readback "$RUNNER_TEMP/protection-readback/immutable-tag-ruleset.json"
              --channel-readback "$RUNNER_TEMP/protection-readback/v4-channel-ruleset.json"
            )
          fi
          "${args[@]}"
      - name: Remove ruleset readback
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/protection-readback" "$RUNNER_TEMP/reviewsensei-token-check"

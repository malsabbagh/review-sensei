# Manual-only lane for the default review exit contract.
#
# The hosted review lanes select `--exit-semantics operational` so their 0/1
# launcher behavior is preserved, which means no hosted review lane exercises
# the default three-tier review exit contract (0 clean, 1 required fixes, 2
# could not complete) against an installed distribution. This lane installs
# the package from the selected ref and runs the standalone smoke, whose cases
# assert those documented exits, the output formats, the clean-host local
# review, and the operational contract.
#
# This workflow is NOT a required CI gate and MUST NOT run on pull_request.
# The hosted engine itself is the reusable review-sensei-run.yml workflow,
# which callers pin by tag; dispatching it here would run every review job, so
# the lane stays a sibling instead of a job inside it.
name: Local review contract

on:
  workflow_dispatch:
    inputs:
      diagnose_immutable_0614:
        description: "Capture immutable 0.6.14 Intel standalone parity; never publish"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  local-review-contract:
    if: ${{ !inputs.diagnose_immutable_0614 }}
    name: Documented local review contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the local CLI
        run: python -m pip install --disable-pip-version-check .

      - name: Run the documented local review contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/standalone_smoke.py \
            --executable "$(command -v review-sensei)" \
            --repository "$GITHUB_WORKSPACE" \
            --diff evaluation/v1/diffs/off-by-one.patch \
            --fixture-response evaluation/v1/responses/off-by-one.json

  diagnose:
    if: github.repository == 'malsabbagh/review-sensei' && inputs.diagnose_immutable_0614
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out reviewed diagnostic code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-code
          persist-credentials: false

      - name: Check out unchanged published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.6.14
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify released identity
        working-directory: release-source
        run: |
          test "$(git rev-parse HEAD)" = 319cd3b53ebeeb8d009366d1f27ca344b1fddd87

      - name: Set up the failed job's exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Install original oracle and build dependencies
        working-directory: release-source
        run: |
          python -m pip install --disable-pip-version-check .
          python -m pip install --disable-pip-version-check -r packaging/standalone/requirements.txt

      - name: Build the unchanged native target
        working-directory: release-source
        run: python scripts/build_standalone.py --target darwin-x64 --output dist/standalone/darwin-x64

      - name: Capture the original strict comparison
        working-directory: release-source
        env:
          PYTHONPATH: src
        run: |
          python ../diagnostic-code/scripts/diagnose_standalone.py \
            --repository "$PWD" \
            --executable "$PWD/dist/standalone/darwin-x64/review-sensei/review-sensei" \
            --expected-sha 319cd3b53ebeeb8d009366d1f27ca344b1fddd87 \
            --report "$RUNNER_TEMP/standalone-diagnostics/parity.json"

      - name: Retain sanitized comparison after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-0.6.14-intel-parity-diagnostics
          path: ${{ runner.temp }}/standalone-diagnostics/parity.json
          if-no-files-found: warn
          retention-days: 7

name: Feature request
description: Propose a focused improvement to ReviewSensei.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and a testable outcome. Do not include credentials, private diffs, private source code, personal data, or raw provider responses.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what limitation or workflow problem exists today?
    validations:
      required: true
  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful behavior from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions that would make this request complete.
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: textarea
    id: affected_areas
    attributes:
      label: Affected areas
      description: Which CLI, provider, workflow, documentation, schema, or test areas may be involved?
    validations:
      required: true
  - type: textarea
    id: architecture_impact
    attributes:
      label: Architecture impact
      description: Explain any public contract, data-handling, authentication, persistence, deployment, or dependency-boundary changes. Say “none expected” when appropriate.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should the behavior be tested or otherwise demonstrated without live credentials or private data?
    validations:
      required: true
  - type: checkboxes
    id: security_privacy
    attributes:
      label: Security and privacy check
      options:
        - label: I have not included credentials, private diffs/source, personal data, or raw provider responses.
          required: true
        - label: I understand that a security vulnerability must be reported through SECURITY.md, not a public feature issue.
          required: true

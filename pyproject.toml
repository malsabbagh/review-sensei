[build-system]
requires = ["setuptools>=77.0", "jsonschema>=4.18,<5"]
build-backend = "setuptools.build_meta"

[project]
name = "review-sensei"
version = "0.1.0"
description = "Provider-neutral AI code review engine with an Ollama adapter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamad Alsabbagh" }]
keywords = ["code-review", "github", "ollama", "ai", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["cryptography>=44,<51", "jsonschema>=4.18,<5"]

[project.urls]
Homepage = "https://github.com/malsabbagh/review-sensei"
Source = "https://github.com/malsabbagh/review-sensei"
Issues = "https://github.com/malsabbagh/review-sensei/issues"
Documentation = "https://github.com/malsabbagh/review-sensei/tree/main/docs"
Changelog = "https://github.com/malsabbagh/review-sensei/blob/main/CHANGELOG.md"
Security = "https://github.com/malsabbagh/review-sensei/blob/main/SECURITY.md"

[project.scripts]
review-sensei = "review_sensei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
review_sensei = [
  "default_categories/*.json",
  "default_stages/*.json",
  "schemas/*.json",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["review_sensei"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
